<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doira Private</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; margin: 0; }
.chat-bg { background: #0a1014; }
.msg-out { background: #005c4b; }
.msg-in { background: #202c33; }
.main-wrap { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.header-bar { flex-shrink: 0; }
.messages-box { flex: 1; overflow-y: auto; }
.input-bar { flex-shrink: 0; }
.msg-menu { position: absolute; background: #1f2c34; border-radius: 8px; padding: 4px; z-index: 100; }
.unread-badge { background: #ff3b30; color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: bold; }
  @media (max-width: 768px) {
.sidebar { position: fixed; z-index: 50; left: -100%; transition: 0.3s; width: 85%!important; height: 100vh; height: 100dvh; }
.sidebar.open { left: 0; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
.overlay.show { display: block; }
.msg-img { max-width: 160px!important; }
.msg-audio { max-width: 180px!important; }
.msg-text { font-size: 14px; }
.btn-icon { font-size: 18px!important; padding: 2px 4px!important; }
   }
.recording { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="chat-bg text-white">

<div id="app"></div>
<audio id="notifSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3"></audio>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getDatabase, ref, set, onValue, push, onDisconnect, serverTimestamp, remove, onChildAdded, update, get } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAksQf3rkeG998TmJj-YuA3WpTDLLZ1ais",
    authDomain: "doira-chat-v2.firebaseapp.com",
    databaseURL: "https://doira-chat-v2-default-rtdb.firebaseio.com",
    projectId: "doira-chat-v2",
    storageBucket: "doira-chat-v2.firebasestorage.app",
    messagingSenderId: "885552294238",
    appId: "1:885552294238:web:8a5d288d1eb57e11b687cf"
  };

  const IMGBB_API_KEY = 'e4cecebb229f451e3322c126e3d09399';
  const STICKERS = ['😀','😂','😍','😘','😎','😭','😡','👍','🔥','❤️','💯','🎉','🤔','🙏','👏','😴','💀','🤡','🥳','😇','😈','🤪','🥺','😱'];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentUserName = '';
  let currentChatId = null;
  let currentChatUser = null;
  let currentChatUid = null;
  let messagesUnsubscribe = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let allUsers = {};
  let friendsList = {};
  let unreadCounts = {};

  const appDiv = document.getElementById('app');
  const notifSound = document.getElementById('notifSound');

  async function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }
  }

  function showLogin() {
    appDiv.innerHTML = `
      <div class="flex items-center justify-center h-screen p-4">
        <div class="bg-[#1f2c34] p-8 rounded-lg w-full max-w-sm">
          <h1 class="text-3xl font-bold text-center mb-6">DOIRA</h1>
          <input id="nameInput" type="text" placeholder="Исмингизни киритинг"
            class="w-full bg-[#2a3942] p-3 rounded mb-4 outline-none">
          <button id="joinBtn" class="w-full bg-[#00a884] p-3 rounded font-bold">Кириш</button>
        </div>
      </div>
    `;
    document.getElementById('joinBtn').onclick = join;
    document.getElementById('nameInput').onkeyup = e => e.key === 'Enter' && join();
  }

  async function join() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    localStorage.setItem('doira_name', name);
    await requestNotificationPermission();
    await signInAnonymously(auth);
  }

  function showChat() {
    appDiv.innerHTML = `
      <div class="overlay" id="overlay"></div>
      <div class="flex h-screen">
        <div class="sidebar w-1/3 bg-[#111b21] border-r border-gray-700 md:relative md:left-0" id="sidebar">
          <div class="bg-[#202c33] p-3 header-bar">
            <div class="flex justify-between items-center mb-2">
              <h1 class="text-lg font-bold">DOIRA</h1>
              <button id="logoutBtn" class="bg-red-600 px-2 py-1 rounded text-xs">Чиқиш</button>
            </div>
            <div id="myProfile" class="bg-[#2a3942] p-2 rounded flex items-center gap-2 cursor-pointer">
              <div class="w-8 h-8 bg-[#00a884] rounded-full flex items-center justify-center text-sm font-bold">👤</div>
              <div class="flex-1">
                <div class="text-xs text-gray-400">Сен:</div>
                <div id="myName" class="text-sm font-bold"></div>
              </div>
              <div class="text-xs">✏️</div>
            </div>
            <input id="searchInput" type="text" placeholder="🔍 Қидириш..."
              class="w-full bg-[#2a3942] p-2 rounded mt-2 outline-none text-sm">
          </div>
          <div id="usersList" class="overflow-y-auto" style="height: calc(100vh - 140px); height: calc(100dvh - 140px);"></div>
        </div>
        <div class="flex-1 main-wrap bg-[#0b141a] w-full">
          <div id="chatHeader" class="bg-[#202c33] p-3 flex items-center gap-3 header-bar">
            <button id="menuBtn" class="md:hidden text-2xl">☰</button>
            <span id="chatHeaderText" class="font-bold text-sm">Суҳбатдошни танланг</span>
          </div>
          <div id="messages" class="messages-box p-2"></div>
          <div id="stickerPanel" class="bg-[#202c33] p-2 hidden grid grid-cols-8 gap-1 max-h-28 overflow-y-auto input-bar"></div>
          <div id="inputArea" class="bg-[#202c33] p-2 hidden input-bar">
            <div class="flex gap-1 items-center">
              <button id="attachBtn" class="btn-icon text-lg px-1">📎</button>
              <button id="stickerBtn" class="btn-icon text-lg px-1">😊</button>
              <input id="msgInput" type="text" placeholder="Хабар..."
                class="flex-1 bg-[#2a3942] p-2 rounded outline-none text-sm">
              <button id="micBtn" class="btn-icon text-lg px-1">🎤</button>
              <button id="sendBtn" class="bg-[#00a884] px-3 py-2 rounded text-xs">Юбор</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
          </div>
        </div>
      </div>
    `;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('stickerBtn').onclick = toggleStickers;
    document.getElementById('micBtn').onclick = toggleRecording;
    document.getElementById('fileInput').onchange = uploadFile;
    document.getElementById('menuBtn').onclick = toggleSidebar;
    document.getElementById('overlay').onclick = toggleSidebar;
    document.getElementById('searchInput').oninput = renderUsers;
    document.getElementById('myProfile').onclick = changeName;
    document.getElementById('myName').textContent = currentUserName;
    loadStickers();
    loadUsers();
    loadUnreadCounts();
  }

  window.changeName = async () => {
    const newName = prompt('Янги исм киритинг:', currentUserName);
    if (!newName || newName.trim() === '' || newName === currentUserName) return;
    const name = newName.trim();
    localStorage.setItem('doira_name', name);
    currentUserName = name;
    currentUser.displayName = name;
    document.getElementById('myName').textContent = name;
    await update(ref(db, `users/${currentUser.uid}`), { name });
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }

  function loadStickers() {
    const panel = document.getElementById('stickerPanel');
    panel.innerHTML = STICKERS.map(s =>
      `<div class="text-2xl cursor-pointer hover:bg-[#2a3942] rounded p-1 text-center" onclick="sendSticker('${s}')">${s}</div>`
    ).join('');
  }

  function toggleStickers() {
    document.getElementById('stickerPanel').classList.toggle('hidden');
  }

  window.sendSticker = async (sticker) => {
    if (!currentChatId) return;
    toggleStickers();
    await push(ref(db, `chats/${currentChatId}`), {
      text: sticker, sender: currentUser.uid, senderName: currentUserName, time: serverTimestamp(), type: 'sticker'
    });
  }

  function loadUnreadCounts() {
    const unreadRef = ref(db, `unread/${currentUser.uid}`);
    onValue(unreadRef, snap => {
      unreadCounts = snap.val() || {};
      renderUsers();
    });
  }

  function loadUsers() {
    const usersRef = ref(db, 'users');
    onValue(usersRef, snap => {
      allUsers = snap.val() || {};
      renderUsers();
    });

    const friendsRef = ref(db, `friends/${currentUser.uid}`);
    onValue(friendsRef, snap => {
      friendsList = snap.val() || {};
      renderUsers();
    });
  }

  function renderUsers() {
    const searchQuery = document.getElementById('searchInput')?.value.toLowerCase() || '';
    const list = document.getElementById('usersList');
    if (!list) return;
    list.innerHTML = '';

    const users = [];
    Object.entries(allUsers).forEach(([uid, user]) => {
      if (uid === currentUser.uid) return;
      if (searchQuery &&!user.name.toLowerCase().includes(searchQuery)) return;
      users.push({ uid,...user, isFriend:!!friendsList[uid], unread: unreadCounts[uid] || 0 });
    });

    users.sort((a, b) => {
      if (a.unread &&!b.unread) return -1;
      if (!a.unread && b.unread) return 1;
      if (a.isFriend &&!b.isFriend) return -1;
      if (!a.isFriend && b.isFriend) return 1;
      return b.lastSeen - a.lastSeen;
    });

    if (users.length === 0) {
      list.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm">Ҳеч ким топилмади</div>';
      return;
    }

    users.forEach(user => {
      const div = document.createElement('div');
      div.className = 'p-3 border-b border-gray-700 hover:bg-[#202c33] cursor-pointer flex items-center gap-3';
      div.innerHTML = `
        <div class="w-2.5 h-2.5 rounded-full ${user.online? 'bg-green-500' : 'bg-gray-500'}"></div>
        <div class="flex-1" onclick="openChatUser('${user.uid}', '${user.name}')">
          <div class="font-bold text-sm flex items-center gap-1">
            ${user.name}
          </div>
          <div class="text-xs text-gray-400">${user.online? 'онлайн' : 'оффлайн'}</div>
        </div>
        <button onclick="event.stopPropagation(); toggleFriend('${user.uid}', ${user.isFriend})" class="text-lg px-2">
          ${user.isFriend? '⭐' : '☆'}
        </button>
        ${user.unread? `<div class="unread-badge">${user.unread}</div>` : ''}
      `;
      list.appendChild(div);
    });
  }

  window.openChatUser = (uid, name) => {
    openChat(uid, name);
    if (window.innerWidth < 768) toggleSidebar();
  }

  window.toggleFriend = async (uid, isFriend) => {
    if (isFriend) {
      await remove(ref(db, `friends/${currentUser.uid}/${uid}`));
    } else {
      await set(ref(db, `friends/${currentUser.uid}/${uid}`), true);
    }
  }

  function openChat(otherUid, otherName) {
    currentChatId = [currentUser.uid, otherUid].sort().join('_');
    currentChatUser = otherName;
    currentChatUid = otherUid;
    document.getElementById('chatHeaderText').textContent = otherName;
    document.getElementById('inputArea').classList.remove('hidden');
    document.getElementById('sendBtn').onclick = sendMsg;
    document.getElementById('msgInput').onkeyup = e => e.key === 'Enter' && sendMsg();

    remove(ref(db, `unread/${currentUser.uid}/${otherUid}`));
    loadMessages();
  }

  function loadMessages() {
    if (messagesUnsubscribe) messagesUnsubscribe();
    const msgsRef = ref(db, `chats/${currentChatId}`);

    let isFirstLoad = true;
    onChildAdded(msgsRef, (snapshot) => {
      const msg = snapshot.val();
      if (!isFirstLoad && msg.sender!== currentUser.uid) {
        if (Notification.permission === 'granted' && document.hidden) {
          new Notification(currentChatUser, {
            body: msg.type === 'text'? msg.text : msg.type === 'sticker'? msg.text : msg.type === 'image'? '📷 Расм' : '🎤 Овозли хабар',
            icon: 'https://i.ibb.co/7vKvV1D/doira-icon.png',
            tag: currentChatId
          });
        }
        notifSound.play().catch(()=>{});

        if (currentChatUid!== msg.sender) {
          const unreadRef = ref(db, `unread/${currentUser.uid}/${msg.sender}`);
          get(unreadRef).then(snap => {
            const count = (snap.val() || 0) + 1;
            set(unreadRef, count);
          });
        }
      }
    });

    messagesUnsubscribe = onValue(msgsRef, snap => {
      const msgs = snap.val() || {};
      const box = document.getElementById('messages');
      box.innerHTML = '';
      Object.entries(msgs).forEach(([key, msg]) => {
        const div = document.createElement('div');
        const isMine = msg.sender === currentUser.uid;
        div.className = `mb-2 flex ${isMine? 'justify-end' : 'justify-start'}`;

        let content = '';
        if (msg.type === 'image') {
          content = `<img src="${msg.url}" class="msg-img rounded-lg">`;
        } else if (msg.type === 'audio') {
          content = `<audio controls src="${msg.audioData}" class="msg-audio"></audio>`;
        } else if (msg.type === 'sticker') {
          content = `<div class="text-5xl md:text-6xl">${msg.text || ''}</div>`;
        } else {
          content = msg.text || '';
        }

        const canDelete = isMine && (msg.type === 'image' || msg.type === 'audio' || msg.type === 'text' || msg.type === 'sticker');

        div.innerHTML = `
          <div class="max-w-[75%] px-3 py-2 rounded-lg text-sm ${isMine? 'msg-out' : 'msg-in'} break-words msg-text"
               ${canDelete? `oncontextmenu="showMsgMenu(event, '${key}'); return false;" ontouchstart="startTouch(event, '${key}')" ontouchend="endTouch()"` : ''}>
            ${content}
          </div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
      isFirstLoad = false;
    });
  }

  let touchTimer = null;
  window.startTouch = (e, key) => {
    touchTimer = setTimeout(() => showMsgMenu(e, key), 600);
  }
  window.endTouch = () => clearTimeout(touchTimer);

  window.showMsgMenu = (e, key) => {
    e.preventDefault();
    document.querySelectorAll('.msg-menu').forEach(m => m.remove());
    const menu = document.createElement('div');
    menu.className = 'msg-menu';
    menu.innerHTML = `<button onclick="deleteMsg('${key}')" class="block px-4 py-2 hover:bg-[#2a3942] rounded text-sm">Ўчириш</button>`;
    menu.style.left = e.pageX + 'px';
    menu.style.top = e.pageY + 'px';
    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 0);
  }

  window.deleteMsg = async (key) => {
    await remove(ref(db, `chats/${currentChatId}/${key}`));
  }

  async function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text ||!currentChatId) return;
    input.value = '';
    await push(ref(db, `chats/${currentChatId}`), {
      text, sender: currentUser.uid, senderName: currentUserName, time: serverTimestamp(), type: 'text'
    });
  }

  async function uploadFile(e) {
    const file = e.target.files[0];
    if (!file ||!currentChatId) return;

    if (!file.type.startsWith('image')) {
      alert('Фақат расм юклай оласиз');
      return;
    }

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.textContent = '...';
    sendBtn.disabled = true;

    try {
      const formData = new FormData();
      formData.append('image', file);
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error?.message);

      await push(ref(db, `chats/${currentChatId}`), {
        url: data.data.url, sender: currentUser.uid, senderName: currentUserName, time: serverTimestamp(), type: 'image'
      });

    } catch (err) {
      alert('Хато: ' + err.message);
    }

    sendBtn.textContent = 'Юбор';
    sendBtn.disabled = false;
    e.target.value = '';
  }

  async function toggleRecording() {
    const micBtn = document.getElementById('micBtn');

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤';
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });

        if (blob.size > 1024 * 1024) {
          alert('Овоз 1MB дан катта. Қисқароқ ёзинг.');
          stream.getTracks().forEach(t => t.stop());
          return;
        }

        micBtn.textContent = '⏳';
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = async () => {
          const base64Audio = reader.result;
          try {
            await push(ref(db, `chats/${currentChatId}`), {
              audioData: base64Audio, sender: currentUser.uid, senderName: currentUserName, time: serverTimestamp(), type: 'audio'
            });
          } catch (err) {
            alert('Овоз юборилмади: ' + err.message);
          }
          micBtn.textContent = '🎤';
          stream.getTracks().forEach(t => t.stop());
        };
      };

      mediaRecorder.start();
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹️';

    } catch (err) {
      alert('Микрофон рухсати керак');
    }
  }

  async function logout() {
    await remove(ref(db, `users/${currentUser.uid}`));
    localStorage.removeItem('doira_name');
    location.reload();
  }

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      currentUserName = localStorage.getItem('doira_name');
      if (!currentUserName) return showLogin();

      currentUser.displayName = currentUserName;
      const userRef = ref(db, `users/${user.uid}`);
      await set(userRef, { name: currentUserName, online: true, lastSeen: serverTimestamp() });
      onDisconnect(userRef).update({ online: false, lastSeen: serverTimestamp() });
      showChat();
    } else {
      showLogin();
    }
  });
</script>

</body>
</html>
