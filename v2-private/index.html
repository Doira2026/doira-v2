<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DoiraChat — телефон орқали кириш</title>
<meta name="theme-color" content="#00c6a2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b141a; --bg2: #111b21; --bg3: #1f2c34; --bg4: #2a3942;
  --accent: #00a884; --accent2: #00cf9d; --text: #e9edef; --text2: #8696a0;
  --border: #2a3942; --msg-out: #005c4b; --msg-in: #202c33; --danger: #f15c6d;
}
body.light { --bg:#dfe5e7; --bg2:#fff; --bg3:#f0f2f5; --bg4:#e2e8ea; --text:#111b21; --text2:#667781; --border:#d1dde3; --msg-out:#d9fdd3; --msg-in:#fff; }
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea{font-family:inherit;border:none;outline:none;background:none;color:var(--text)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
#app{display:flex;height:100vh}
#loadingScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
.load-logo{font-size:52px;animation:bounce .8s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.load-title{font-size:24px;font-weight:700;color:var(--accent)}
.load-bar{width:180px;height:3px;background:var(--bg4);border-radius:3px;overflow:hidden}
.load-progress{height:100%;background:var(--accent);width:70%;animation:loadAnim 1.5s infinite}
@keyframes loadAnim{0%{width:0%}50%{width:70%}100%{width:0%;margin-left:100%}}
#loginScreen{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-wrap{width:min(400px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px 32px;text-align:center;animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.login-emoji{font-size:56px;margin-bottom:12px}
.login-title{font-size:26px;font-weight:700;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.login-input{width:100%;background:var(--bg3);border-radius:12px;padding:13px 16px;font-size:16px;text-align:center;border:2px solid transparent;transition:.2s}
.login-input:focus{border-color:var(--accent)}
.login-err{font-size:12px;color:var(--danger);margin-bottom:8px;min-height:16px}
.login-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:700;transition:.2s;margin-top:4px}
.login-btn:active{transform:scale(.98)}
.phone-row{display:flex;gap:8px;margin-bottom:10px}
.phone-row select{width:100px}
.code-row{display:none;gap:8px;margin-top:8px}
.code-row.open{display:flex}
.code-row .login-btn{width:auto;padding:13px 20px}
.sb-head{background:var(--bg3);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.sb-top{display:flex;justify-content:space-between;align-items:center}
.sb-logo{font-size:19px;font-weight:700;color:var(--accent)}
.sb-logo span{color:var(--text)}
.sb-actions{display:flex;gap:6px}
.sb-btn{padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg4);transition:.15s}
.sb-btn:active{transform:scale(.96)}
.my-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg4);cursor:pointer}
.my-card:active{background:var(--border)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;background-size:cover;background-position:center}
.avatar.sm{width:32px;height:32px;font-size:13px}
.search-row{display:flex;align-items:center;gap:8px;background:var(--bg4);border-radius:10px;padding:8px 12px}
.search-row input{flex:1;font-size:14px}
#usersList{flex:1;overflow-y:auto}
.uitem{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.uitem:active,.uitem.active{background:var(--bg3)}
.uitem .info{flex:1;min-width:0}
.uitem .uname{font-weight:600;font-size:14px}
.uitem .usub{font-size:12px;color:var(--text2)}
.odot{width:9px;height:9px;border-radius:50%;background:var(--text2)}
.odot.on{background:#44c767}
.badge{background:var(--accent);color:#fff;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:700}
.tag{font-size:10px;padding:1px 5px;border-radius:4px}
.tag.grp{background:rgba(0,168,132,.15);color:var(--accent)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#chatHead{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px}
#menuBtn{font-size:22px;display:none;color:var(--text2)}
#chatHead .info{flex:1;cursor:pointer}
#chatTitle{font-weight:700;font-size:15px}
#chatSub{font-size:12px;color:var(--text2)}
#callBtn{font-size:20px;padding:6px 12px;border-radius:8px;display:flex;gap:6px;align-items:center}
#callBtn:active{background:var(--bg4)}
#messages{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.mrow{display:flex;max-width:78%;margin-bottom:2px}
.mrow.out{align-self:flex-end;flex-direction:row-reverse}
.mrow.in{align-self:flex-start}
.mbub{padding:7px 11px 5px;border-radius:12px;font-size:14px;line-height:1.4;position:relative}
.mrow.out .mbub{background:var(--msg-out);border-bottom-right-radius:3px}
.mrow.in .mbub{background:var(--msg-in);border-bottom-left-radius:3px}
.msender{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
.mmeta{display:flex;align-items:center;gap:3px;justify-content:flex-end;font-size:10px;color:var(--text2);margin-top:3px}
.tick.seen{color:var(--accent)}
.mimg{border-radius:10px;max-width:200px;cursor:pointer}
.msticker{font-size:48px}
.maudio audio{width:160px}
.date-divider{align-self:center;background:var(--bg3);border-radius:8px;padding:3px 10px;font-size:11px;color:var(--text2);margin:6px 0}
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;color:var(--text2)}
.empty-icon{font-size:70px;opacity:.2}
#inputBar{background:var(--bg2);border-top:1px solid var(--border);padding:8px 10px}
#editBan{display:none;background:var(--bg3);padding:5px 12px;font-size:12px;border-left:3px solid var(--accent);justify-content:space-between;margin-bottom:6px;border-radius:4px}
#editBan.show{display:flex}
.irow{display:flex;align-items:flex-end;gap:6px}
.ibtn{font-size:20px;padding:8px;border-radius:9px;color:var(--text2)}
.ibtn:active{background:var(--bg4)}
#msgInput{flex:1;background:var(--bg4);border-radius:20px;padding:10px 15px;font-size:15px;min-height:42px;max-height:130px;resize:none}
#sendBtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
#sendBtn:active{transform:scale(.95)}
.recording #micBtn{animation:pulse 1s infinite;color:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#stickerPanel{background:var(--bg2);border-top:1px solid var(--border);padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:4px;max-height:130px;overflow-y:auto}
#stickerPanel.open{display:grid}
.sitem{font-size:26px;text-align:center;padding:5px;cursor:pointer}
.sitem:active{background:var(--bg4);transform:scale(1.18)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal-box{background:var(--bg2);border-radius:18px;padding:24px;width:min(440px,100%);max-height:85vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-input{width:100%;background:var(--bg4);border-radius:10px;padding:11px 14px;margin-bottom:10px}
.modal-btns{display:flex;gap:8px;margin-top:6px}
.mbtn{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600}
.mbtn.primary{background:var(--accent);color:#fff}
.mbtn.gray{background:var(--bg4)}
.gcb-item,.member-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:var(--bg3);margin-bottom:6px}
.member-item .rmv-btn{margin-left:auto;color:var(--danger);font-size:18px;padding:4px 8px}
#callModal{position:fixed;inset:0;z-index:800;background:#0b141a;display:none;flex-direction:column;align-items:center;justify-content:center}
#callModal.open{display:flex}
.call-av{width:96px;height:96px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;margin-bottom:16px}
.call-name{font-size:24px;font-weight:700;color:#fff}
.call-stat{font-size:14px;color:#aaa;margin-bottom:40px}
.call-btns{display:flex;gap:24px}
.cbtn{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
.cbtn.acc{background:#44c767}
.cbtn.end{background:var(--danger)}
.cbtn:active{transform:scale(1.1)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
#overlay.open{display:block}
#imgPrev{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:900;display:none;align-items:center;justify-content:center}
#imgPrev.open{display:flex}
#imgPrev img{max-width:95vw;max-height:95vh}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg3);border-radius:10px;padding:8px 16px;font-size:13px;z-index:999;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:768px){#sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);width:85%;z-index:101}#sidebar.open{transform:translateX(0)}#menuBtn{display:block!important}.mrow{max-width:88%}}
</style>
</head>

{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js","firebase/database":"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js","firebase/storage":"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js"}}
</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getAuth, signInWithPhoneNumber, RecaptchaVerifier, onAuthStateChanged, updateProfile } from 'firebase/auth';
import { getDatabase, ref, set, get, push, update, remove, onValue, onChildAdded, onDisconnect, serverTimestamp, off } from 'firebase/database';
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from 'firebase/storage';

const config = { apiKey: "AIzaSyAksQf3rkeG998TmJj-YuA3WpTDLLZ1ais", authDomain: "doira-chat-v2.firebaseapp.com", databaseURL: "https://doira-chat-v2-default-rtdb.firebaseio.com", projectId: "doira-chat-v2", storageBucket: "doira-chat-v2.firebasestorage.app", messagingSenderId: "885552294238", appId: "1:885552294238:web:8a5d288d1eb57e11b687cf" };
const app = initializeApp(config);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);
const STICKERS = ['😀','😂','😍','😘','😎','😭','😡','👍','🔥','❤️','🎉','🤔','🙏','👏','🥳','🤪','🫶','💪','🚀','🌟'];

let me, myUid, myName, myPhone;
let chatId, chatUid, isGrp = false, chatName;
let editKey = null, typingTimer = null;
let mediaRec, audioChunks = [];
let pc = null, localStream = null, callActive = false, isVideoCall = false;

function toast(msg) { let t = document.createElement('div'); t.className = 'toast'; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function av(n) { return (n || '?')[0].toUpperCase(); }

let recaptchaVerifier;
window.onload = () => { recaptchaVerifier = new RecaptchaVerifier(auth, 'sendCodeBtn', { size: 'invisible' }); };

// Phone login
let confirmationResult = null;
$('sendCodeBtn').onclick = async () => {
  let code = $('countryCode').value;
  let phone = $('phoneInput').value.trim().replace(/\D/g,'');
  if (!phone) { $('loginErr').innerText = 'Telefon raqam kiriting'; return; }
  let fullPhone = code + phone;
  $('loginErr').innerText = '';
  try {
    confirmationResult = await signInWithPhoneNumber(auth, fullPhone, recaptchaVerifier);
    $('codeRow').classList.add('open');
    toast('SMS kod yuborildi');
  } catch(e) { $('loginErr').innerText = 'Xatolik: '+e.message; }
};
$('verifyBtn').onclick = async () => {
  let code = $('codeInput').value.trim();
  if (!code) return;
  try {
    let result = await confirmationResult.confirm(code);
    myPhone = result.user.phoneNumber;
    localStorage.setItem('dc_phone', myPhone);
    let snap = await get(ref(db, `users/${result.user.uid}`));
    if (!snap.exists()) {
      let name = 'User' + Math.floor(Math.random()*1000);
      await set(ref(db, `users/${result.user.uid}`), { name, phone: myPhone, online: true, lastSeen: serverTimestamp() });
      localStorage.setItem('dc_name', name);
    } else {
      localStorage.setItem('dc_name', snap.val().name || 'User');
    }
    $('loginScreen').style.display = 'none';
    $('app').style.display = 'flex';
    $('loadingScreen').style.display = 'none';
    location.reload();
  } catch(e) { $('loginErr').innerText = 'Kod noto\'g\'ri'; }
};

onAuthStateChanged(auth, async (u) => {
  if (u && !$('app').style.display === 'flex') {
    myUid = u.uid;
    myName = localStorage.getItem('dc_name') || u.phoneNumber;
    myPhone = u.phoneNumber;
    let snap = await get(ref(db, `users/${myUid}`));
    if (!snap.exists()) await set(ref(db, `users/${myUid}`), { name: myName, phone: myPhone, online: true, lastSeen: serverTimestamp() });
    else await update(ref(db, `users/${myUid}`), { online: true, lastSeen: serverTimestamp() });
    onDisconnect(ref(db, `users/${myUid}`)).update({ online: false, lastSeen: serverTimestamp() });
    $('loadingScreen').style.display = 'none';
    $('loginScreen').style.display = 'none';
    $('app').style.display = 'flex';
    $('myName').innerText = myName;
    $('myAv').innerText = av(myName);
    initApp();
  } else if (!u && !$('loginScreen').style.display === 'flex') {
    $('loadingScreen').style.display = 'none';
    $('loginScreen').style.display = 'flex';
    $('app').style.display = 'none';
  }
});

function initApp() {
  renderUsers();
  buildStickers();
  $('themeBtn').onclick = () => { document.body.classList.toggle('light'); };
  $('newGrpBtn').onclick = openGrpModal;
  $('logoutBtn').onclick = () => { auth.signOut(); localStorage.clear(); location.reload(); };
  $('menuBtn').onclick = () => { $('sidebar').classList.toggle('open'); $('overlay').classList.toggle('open'); };
  $('myCard').onclick = changeProfilePhoto;
  $('attachBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = sendImage;
  $('stickerBtn').onclick = () => $('stickerPanel').classList.toggle('open');
  $('micBtn').onclick = toggleRecording;
  $('sendBtn').onclick = sendMessage;
  $('cancelEditBtn').onclick = () => { editKey = null; $('editBan').classList.remove('show'); $('msgInput').value = ''; };
  $('callBtn').onclick = startCall;
  $('acceptBtn').onclick = acceptCall;
  $('endBtn').onclick = endCall;
  $('closeAddMemberBtn').onclick = () => $('addMemberModal').classList.remove('open');
  $('closeGrpInfo').onclick = () => $('grpInfoModal').classList.remove('open');
  $('addMemberBtn').onclick = openAddMember;
  $('msgInput').addEventListener('input', () => { if(chatUid) handleTyping(); autoResize(); });
  $('msgInput').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  document.getElementById('closePrevBtn').onclick = () => $('imgPrev').classList.remove('open');
  $('imgPrev').onclick = e => { if(e.target === $('imgPrev')) $('imgPrev').classList.remove('open'); };
  onValue(ref(db, 'users'), s => { users = s.val() || {}; renderUsers(); });
  onValue(ref(db, 'groups'), s => { groups = s.val() || {}; renderUsers(); });
  listenCalls();
}

let users = {}, groups = {};
function renderUsers() {
  let q = ($('searchInput').value || '').toLowerCase();
  let container = $('usersList');
  container.innerHTML = '';
  let items = [];
  Object.entries(groups).forEach(([gid, g]) => { if(g.members && g.members[myUid]) items.push({ id: gid, name: g.name, type: 'grp', members: Object.keys(g.members||{}).length }); });
  Object.entries(users).forEach(([uid, u]) => { if(uid !== myUid && u.name) items.push({ id: uid, name: u.name, online: u.online, type: 'user' }); });
  items.sort((a,b) => (b.online?1:0) - (a.online?1:0));
  for(let item of items) {
    if(q && !item.name.toLowerCase().includes(q)) continue;
    let div = document.createElement('div');
    div.className = 'uitem';
    if(item.type === 'grp') {
      div.innerHTML = `<div class="avatar" style="background:#1d6a4a">👥</div><div class="info"><div class="uname">${esc(item.name)} <span class="tag grp">GURUH</span></div><div class="usub">${item.members} a'zo</div></div>`;
      div.onclick = () => openChat(item.id, item.name, true);
    } else {
      div.innerHTML = `<div class="odot ${item.online ? 'on' : ''}"></div><div class="avatar">${av(item.name)}</div><div class="info"><div class="uname">${esc(item.name)}</div><div class="usub">${item.online ? '🟢 online' : 'offline'}</div></div>`;
      div.onclick = () => openChat(item.id, item.name, false);
    }
    container.appendChild(div);
  }
}

function openChat(id, name, isGroup) {
  isGrp = isGroup;
  chatName = name;
  chatUid = isGroup ? null : id;
  chatId = isGroup ? id : [myUid, id].sort().join('_');
  $('chatTitle').innerText = name;
  $('chatSub').innerText = isGroup ? 'Guruh' : (users[id]?.online ? '🟢 online' : 'offline');
  $('callBtn').style.display = isGroup ? 'none' : 'flex';
  if(!isGroup) remove(ref(db, `unread/${myUid}/${id}`));
  $('messages').innerHTML = '';
  loadMessages();
  renderUsers();
  if(window.innerWidth<768) { $('sidebar').classList.remove('open'); $('overlay').classList.remove('open'); }
}

function loadMessages() {
  let msgsRef = ref(db, `chats/${chatId}`);
  onValue(msgsRef, (snap) => {
    let msgs = snap.val() || {};
    let container = $('messages');
    container.innerHTML = '';
    let lastDate = '';
    Object.entries(msgs).sort((a,b) => (a[1].time||0) - (b[1].time||0)).forEach(([key, m]) => {
      let d = m.time ? new Date(m.time).toLocaleDateString() : '';
      if(d && d !== lastDate) { lastDate = d; let dv = document.createElement('div'); dv.className = 'date-divider'; dv.innerText = d; container.appendChild(dv); }
      let row = document.createElement('div');
      row.className = `mrow ${m.sender === myUid ? 'out' : 'in'}`;
      let tick = m.sender === myUid ? `<span class="tick ${m.status==='seen'?'seen':''}">${m.status==='seen'?'✓✓':'✓'}</span>` : '';
      let content = '';
      if(m.type === 'image') content = `<img src="${esc(m.url)}" class="mimg" onclick="window._preview('${esc(m.url)}')">`;
      else if(m.type === 'sticker') content = `<div class="msticker">${m.text}</div>`;
      else if(m.type === 'audio') content = `<div class="maudio"><audio controls src="${esc(m.url)}"></audio></div>`;
      else content = `<div>${esc(m.text)}</div>`;
      row.innerHTML = `<div class="mbub"><div class="msender">${m.sender===myUid?'':esc(m.senderName||'')}</div>${content}<div class="mmeta">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${tick}</div></div>`;
      container.appendChild(row);
    });
    container.scrollTop = container.scrollHeight;
    if(chatUid) Object.keys(msgs).forEach(k => { if(msgs[k].sender !== myUid && msgs[k].status !== 'seen') update(ref(db, `chats/${chatId}/${k}`), { status: 'seen' }); });
  });
}

async function sendMessage() {
  let txt = $('msgInput').value.trim();
  if(!txt && !editKey) return;
  if(editKey) {
    await update(ref(db, `chats/${chatId}/${editKey}`), { text: txt, edited: true });
    editKey = null;
    $('editBan').classList.remove('show');
    $('msgInput').value = '';
  } else {
    await push(ref(db, `chats/${chatId}`), { text: txt, sender: myUid, senderName: myName, time: serverTimestamp(), type: 'text', status: 'sent' });
    if(chatUid) await set(ref(db, `unread/${chatUid}/${myUid}`), (await get(ref(db, `unread/${chatUid}/${myUid}`))).val() + 1 || 1);
    $('msgInput').value = '';
  }
  autoResize();
}

async function sendImage(e) {
  let file = e.target.files[0];
  if(!file || !chatId) return;
  let ext = file.type.split('/')[1];
  let storageRef = sRef(storage, `images/${Date.now()}.${ext}`);
  await uploadBytes(storageRef, file);
  let url = await getDownloadURL(storageRef);
  await push(ref(db, `chats/${chatId}`), { url, sender: myUid, senderName: myName, time: serverTimestamp(), type: 'image', status: 'sent' });
  $('fileInput').value = '';
  toast('Rasm yuborildi');
}

async function toggleRecording() {
  if(mediaRec && mediaRec.state === 'recording') {
    mediaRec.stop();
    $('inputBar').classList.remove('recording');
    return;
  }
  let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioChunks = [];
  mediaRec = new MediaRecorder(stream);
  mediaRec.ondataavailable = e => audioChunks.push(e.data);
  mediaRec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    let blob = new Blob(audioChunks, { type: 'audio/webm' });
    let storageRef = sRef(storage, `audio/${Date.now()}.webm`);
    await uploadBytes(storageRef, blob);
    let url = await getDownloadURL(storageRef);
    await push(ref(db, `chats/${chatId}`), { url, sender: myUid, senderName: myName, time: serverTimestamp(), type: 'audio', status: 'sent' });
    toast('Ovozli xabar yuborildi');
  };
  mediaRec.start();
  $('inputBar').classList.add('recording');
  toast('Yozmoqda... to\'xtatish uchun yana bosing');
}

function buildStickers() {
  $('stickerPanel').innerHTML = STICKERS.map(s => `<div class="sitem" onclick="window._sendSticker('${s}')">${s}</div>`).join('');
}
window._sendSticker = async (s) => {
  if(!chatId) return;
  await push(ref(db, `chats/${chatId}`), { text: s, sender: myUid, senderName: myName, time: serverTimestamp(), type: 'sticker', status: 'sent' });
  $('stickerPanel').classList.remove('open');
};
window._preview = (url) => { $('prevImg').src = url; $('imgPrev').classList.add('open'); };

function handleTyping() {
  if(!chatUid) return;
  set(ref(db, `typing/${chatId}/${myUid}`), true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => set(ref(db, `typing/${chatId}/${myUid}`), false), 1500);
}
function autoResize() { $('msgInput').style.height = 'auto'; $('msgInput').style.height = Math.min($('msgInput').scrollHeight, 130) + 'px'; }

async function changeProfilePhoto() {
  let inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = async (e) => {
    let file = e.target.files[0];
    if(!file) return;
    let storageRef = sRef(storage, `avatars/${myUid}.jpg`);
    await uploadBytes(storageRef, file);
    let url = await getDownloadURL(storageRef);
    await update(ref(db, `users/${myUid}`), { avatar: url });
    $('myAv').style.backgroundImage = `url(${url})`;
    $('myAv').innerText = '';
    toast('Rasm o\'rnatildi');
  };
  inp.click();
}

// Groups
async function openGrpModal() {
  let list = $('grpUsersList');
  list.innerHTML = '';
  for(let [uid, u] of Object.entries(users)) {
    if(uid === myUid || !u.name) continue;
    let div = document.createElement('div');
    div.className = 'gcb-item';
    div.innerHTML = `<input type="checkbox" value="${uid}"><div class="avatar sm">${av(u.name)}</div><span>${esc(u.name)}</span>`;
    list.appendChild(div);
  }
  $('grpModal').classList.add('open');
}
$('cancelGrpBtn').onclick = () => $('grpModal').classList.remove('open');
$('createGrpBtn').onclick = async () => {
  let name = $('grpNameInput').value.trim();
  if(!name) return toast('Guruh nomi kerak');
  let members = { [myUid]: true };
  document.querySelectorAll('#grpUsersList input:checked').forEach(cb => members[cb.value] = true);
  let newGrpRef = push(ref(db, 'groups'));
  await set(newGrpRef, { name, creator: myUid, members, created: serverTimestamp() });
  $('grpModal').classList.remove('open');
  $('grpNameInput').value = '';
  toast('Guruh yaratildi');
};
async function openGrpInfo() {
  if(!isGrp || !chatId) return;
  let g = (await get(ref(db, `groups/${chatId}`))).val();
  if(!g) return;
  $('grpInfoName').innerText = g.name;
  let membersList = $('grpMembersList');
  membersList.innerHTML = '';
  for(let [uid] of Object.entries(g.members || {})) {
    let u = users[uid];
    if(!u) continue;
    let div = document.createElement('div');
    div.className = 'member-item';
    div.innerHTML = `<div class="odot ${u.online?'on':''}"></div><div class="avatar sm">${av(u.name)}</div><span>${esc(u.name)}${uid === g.creator ? ' 👑' : ''}</span>`;
    if(uid !== myUid && g.creator === myUid) {
      let rmv = document.createElement('button');
      rmv.innerText = '✖';
      rmv.className = 'rmv-btn';
      rmv.onclick = async () => { await remove(ref(db, `groups/${chatId}/members/${uid}`)); toast(`${u.name} guruhdan chiqarildi`); openGrpInfo(); };
      div.appendChild(rmv);
    }
    membersList.appendChild(div);
  }
  $('grpInfoModal').classList.add('open');
}
$('chatInfoBtn').onclick = () => { if(isGrp) openGrpInfo(); };
async function openAddMember() {
  let list = $('addMemberUsersList');
  list.innerHTML = '';
  let grp = (await get(ref(db, `groups/${chatId}`))).val();
  for(let [uid, u] of Object.entries(users)) {
    if(uid === myUid || grp.members[uid] || !u.name) continue;
    let div = document.createElement('div');
    div.className = 'gcb-item';
    div.innerHTML = `<input type="checkbox" value="${uid}"><div class="avatar sm">${av(u.name)}</div><span>${esc(u.name)}</span>`;
    list.appendChild(div);
  }
  let addBtn = document.createElement('button');
  addBtn.innerText = 'Qo\'shish';
  addBtn.className = 'mbtn primary';
  addBtn.onclick = async () => {
    let selected = [];
    document.querySelectorAll('#addMemberUsersList input:checked').forEach(cb => selected.push(cb.value));
    for(let uid of selected) await set(ref(db, `groups/${chatId}/members/${uid}`), true);
    $('addMemberModal').classList.remove('open');
    toast('A\'zolar qo\'shildi');
    openGrpInfo();
  };
  list.appendChild(addBtn);
  $('addMemberModal').classList.add('open');
}

// WebRTC Video/Audio Call
let localVideo = $('localVideo'), remoteVideo = $('remoteVideo');
async function startCall() {
  if(!chatUid) return;
  isVideoCall = confirm('Video qo\'ng\'iroq? (Yo\'q = audio)');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
    if(isVideoCall) { localVideo.style.display = 'block'; localVideo.srcObject = localStream; }
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.ontrack = e => { if(e.track.kind === 'video') remoteVideo.srcObject = e.streams[0]; else $('remoteAudio').srcObject = e.streams[0]; };
    let offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    let callRef = push(ref(db, 'calls'));
    await set(callRef, { from: myUid, to: chatUid, offer: JSON.stringify(offer), callerName: myName, video: isVideoCall });
    $('callName').innerText = users[chatUid]?.name;
    $('callAv').innerText = av(users[chatUid]?.name);
    $('callStat').innerText = 'Qo\'ng\'iroq qilinmoqda...';
    $('acceptBtn').style.display = 'none';
    $('callModal').classList.add('open');
    $('ringSnd').play();
    listenForAnswer(callRef.key);
  } catch(e) { toast('Mikrofon/video ruxsati kerak'); }
}
function listenForAnswer(callId) {
  let ansRef = ref(db, `calls/${callId}/answer`);
  onValue(ansRef, async (s) => {
    if(s.val() && pc) {
      await pc.setRemoteDescription(JSON.parse(s.val()));
      $('callStat').innerText = 'Ulandi';
      $('ringSnd').pause();
      off(ansRef);
    }
  });
}
async function acceptCall() {
  let snap = await get(ref(db, 'calls'));
  let call = null, callId = null;
  for(let [id, c] of Object.entries(snap.val() || {})) { if(c.to === myUid && !c.answered) { call = c; callId = id; break; } }
  if(!call) return;
  isVideoCall = call.video;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
    if(isVideoCall) { localVideo.style.display = 'block'; localVideo.srcObject = localStream; }
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    pc.ontrack = e => { if(e.track.kind === 'video') remoteVideo.srcObject = e.streams[0]; else $('remoteAudio').srcObject = e.streams[0]; };
    await pc.setRemoteDescription(JSON.parse(call.offer));
    let answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await update(ref(db, `calls/${callId}`), { answer: JSON.stringify(answer), answered: true });
    $('callStat').innerText = 'Ulandi';
    $('ringSnd').pause();
    $('acceptBtn').style.display = 'none';
  } catch(e) { toast('Xatolik'); }
}
function endCall() {
  if(localStream) localStream.getTracks().forEach(t => t.stop());
  if(pc) pc.close();
  pc = null; localStream = null;
  localVideo.style.display = 'none'; remoteVideo.style.display = 'none';
  $('callModal').classList.remove('open');
  $('ringSnd').pause();
}
function listenCalls() {
  onValue(ref(db, 'calls'), (s) => {
    for(let [id, call] of Object.entries(s.val() || {})) {
      if(call.to === myUid && !call.answered && !callActive) {
        callActive = true;
        $('callName').innerText = call.callerName;
        $('callAv').innerText = av(call.callerName);
        $('callStat').innerText = `📞 ${call.video ? 'Video' : 'Audio'} qo'ng'iroq`;
        $('acceptBtn').style.display = 'flex';
        $('callModal').classList.add('open');
        $('ringSnd').play();
        window.currentCallId = id;
        break;
      }
    }
  });
}
</script>
