<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doira Private</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; overflow: hidden; }
   .chat-bg { background: #0a1014; }
   .msg-out { background: #005c4b; }
   .msg-in { background: #202c33; }
    @media (max-width: 768px) {
      .sidebar { position: absolute; width: 100%; z-index: 20; height: 100vh; }
      .sidebar.hidden-mobile { display: none; }
      .chat-area { width: 100%; }
    }
  </style>
</head>
<body class="chat-bg text-white">

<div id="app"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getDatabase, ref, set, onValue, push, onDisconnect, serverTimestamp, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAksQf3rkeG998TmJj-YuA3WpTDLLZ1ais",
    authDomain: "doira-chat-v2.firebaseapp.com",
    databaseURL: "https://doira-chat-v2-default-rtdb.firebaseio.com",
    projectId: "doira-chat-v2",
    storageBucket: "doira-chat-v2.firebasestorage.app",
    messagingSenderId: "885552294238",
    appId: "1:885552294238:web:8a5d288d1eb57e11b687cf"
  };

  const IMGBB_API_KEY = 'e4cecebb229f451e3322c126e3d09399';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentChatId = null;
  let messagesUnsubscribe = null;

  const appDiv = document.getElementById('app');

  function showLogin() {
    appDiv.innerHTML = `
      <div class="flex items-center justify-center h-screen">
        <div class="bg-[#1f2c34] p-8 rounded-lg w-11/12 max-w-sm">
          <h1 class="text-3xl font-bold text-center mb-6">DOIRA</h1>
          <input id="nameInput" type="text" placeholder="Исмингизни киритинг"
            class="w-full bg-[#2a3942] p-3 rounded mb-4 outline-none">
          <button id="joinBtn" class="w-full bg-[#00a884] p-3 rounded font-bold">Кириш</button>
        </div>
      </div>
    `;
    document.getElementById('joinBtn').onclick = join;
    document.getElementById('nameInput').onkeyup = e => e.key === 'Enter' && join();
  }

  async function join() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    localStorage.setItem('doira_name', name);
    await signInAnonymously(auth);
  }

  function showChat() {
    appDiv.innerHTML = `
      <div class="flex h-screen">
        <div id="sidebar" class="sidebar w-full md:w-1/3 bg-[#111b21] border-r border-gray-700">
          <div class="bg-[#202c33] p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">DOIRA Чат</h1>
            <button id="logoutBtn" class="bg-red-600 px-4 py-2 rounded text-sm">Чиқиш</button>
          </div>
          <div id="usersList" class="overflow-y-auto h-[calc(100vh-64px)]"></div>
        </div>
        <div id="chatArea" class="chat-area flex-1 flex-col bg-[#0b141a] hidden md:flex">
          <div id="chatHeader" class="bg-[#202c33] p-4 flex items-center gap-3">
            <button id="backBtn" class="md:hidden text-2xl">←</button>
            <span id="chatName" class="font-bold"></span>
          </div>
          <div id="messages" class="flex-1 overflow-y-auto p-4"></div>
          <div id="inputArea" class="bg-[#202c33] p-4">
            <div class="flex gap-2 items-center">
              <button id="attachBtn" class="text-2xl px-2">📎</button>
              <input id="msgInput" type="text" placeholder="Хабар..."
                class="flex-1 bg-[#2a3942] p-2 rounded outline-none">
              <button id="sendBtn" class="bg-[#00a884] px-6 py-2 rounded">Юбор</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
          </div>
        </div>
      </div>
    `;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('backBtn').onclick = closeChatMobile;
    document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = uploadFile;
    document.getElementById('sendBtn').onclick = sendMsg;
    document.getElementById('msgInput').onkeyup = e => e.key === 'Enter' && sendMsg();
    loadUsers();
  }

  function loadUsers() {
    const usersRef = ref(db, 'users');
    onValue(usersRef, snap => {
      const users = snap.val() || {};
      const list = document.getElementById('usersList');
      list.innerHTML = '';

      const uniqueUsers = {};
      Object.entries(users).forEach(([uid, user]) => {
        if (uid === currentUser.uid) return;
        if (!uniqueUsers[user.name] || user.lastSeen > uniqueUsers[user.name].lastSeen) {
          uniqueUsers[user.name] = {...user, uid};
        }
      });

      Object.values(uniqueUsers).forEach(user => {
        const div = document.createElement('div');
        div.className = 'p-4 border-b border-gray-700 hover:bg-[#202c33] cursor-pointer flex items-center gap-3';
        div.innerHTML = `
          <div class="w-3 h-3 rounded-full ${user.online? 'bg-green-500' : 'bg-gray-500'}"></div>
          <div>
            <div class="font-bold">${user.name}</div>
            <div class="text-xs text-gray-400">${user.online? 'онлайн' : 'оффлайн'}</div>
          </div>
        `;
        div.onclick = () => openChat(user.uid, user.name);
        list.appendChild(div);
      });
    });
  }

  function openChat(otherUid, otherName) {
    currentChatId = [currentUser.uid, otherUid].sort().join('_');
    document.getElementById('chatName').textContent = otherName;
    
    // Телефонда: sidebar ни яшир, чатни кўрсат
    if (window.innerWidth < 768) {
      document.getElementById('sidebar').classList.add('hidden-mobile');
      document.getElementById('chatArea').classList.remove('hidden');
      document.getElementById('chatArea').classList.add('flex');
    }
    
    loadMessages();
  }

  function closeChatMobile() {
    document.getElementById('sidebar').classList.remove('hidden-mobile');
    document.getElementById('chatArea').classList.add('hidden');
    document.getElementById('chatArea').classList.remove('flex');
    if (messagesUnsubscribe) messagesUnsubscribe();
    currentChatId = null;
  }

  function loadMessages() {
    if (messagesUnsubscribe) messagesUnsubscribe();
    const msgsRef = ref(db, `chats/${currentChatId}`);
    messagesUnsubscribe = onValue(msgsRef, snap => {
      const msgs = snap.val() || {};
      const box = document.getElementById('messages');
      box.innerHTML = '';
      Object.values(msgs).forEach(msg => {
        const div = document.createElement('div');
        const isMine = msg.sender === currentUser.uid;
        div.className = `mb-2 flex ${isMine? 'justify-end' : 'justify-start'}`;

        let content = '';
        if (msg.type === 'image') {
          content = `<img src="${msg.url}" class="max-w-[200px] md:max-w-xs rounded-lg">`;
        } else {
          content = msg.text;
        }

        div.innerHTML = `
          <div class="max-w-[75%] px-4 py-2 rounded-lg ${isMine? 'msg-out' : 'msg-in'} break-words">
            ${content}
          </div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    });
  }

  async function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text ||!currentChatId) return;
    input.value = '';
    await push(ref(db, `chats/${currentChatId}`), {
      text, sender: currentUser.uid, time: serverTimestamp(), type: 'text'
    });
  }

  async function uploadFile(e) {
    const file = e.target.files[0];
    if (!file ||!currentChatId) return;

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.textContent = '...';
    sendBtn.disabled = true;

    const formData = new FormData();
    formData.append('image', file);

    try {
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      if (data.success) {
        await push(ref(db, `chats/${currentChatId}`), {
          url: data.data.url, 
          sender: currentUser.uid, 
          time: serverTimestamp(), 
          type: 'image'
        });
      } else {
        alert('Расм юкланмади: ' + data.error?.message);
      }
    } catch (err) {
      alert('Хато: ' + err.message);
    }
    
    sendBtn.textContent = 'Юбор';
    sendBtn.disabled = false;
    e.target.value = '';
  }

  async function logout() {
    await remove(ref(db, `users/${currentUser.uid}`));
    localStorage.removeItem('doira_name');
    location.reload();
  }

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      const name = localStorage.getItem('doira_name');
      if (!name) return showLogin();

      const userRef = ref(db, `users/${user.uid}`);
      await set(userRef, { name, online: true, lastSeen: serverTimestamp() });
      onDisconnect(userRef).update({ online: false, lastSeen: serverTimestamp() });
      showChat();
    } else {
      showLogin();
    }
  });
</script>

</body>
</html>
