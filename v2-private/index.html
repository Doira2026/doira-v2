<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doira Chat</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  margin:0;
  background:#0b141a;
  font-family:sans-serif;
  overflow:hidden;
}

.sidebar{
  width:320px;
  background:#111b21;
  border-right:1px solid #222;
}

.chat-area{
  flex:1;
  display:flex;
  flex-direction:column;
}

.msg-out{
  background:#005c4b;
}

.msg-in{
  background:#202c33;
}

.messages{
  flex:1;
  overflow-y:auto;
}

@media(max-width:768px){
  .sidebar{
    position:absolute;
    z-index:100;
    left:-100%;
    height:100vh;
    transition:.3s;
  }

  .sidebar.open{
    left:0;
  }
}
</style>
</head>

<body class="text-white">

<div id="app"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInAnonymously,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
set,
push,
onValue,
serverTimestamp,
update,
onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "123456",
  appId: "APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentName = "";
let currentChat = null;

const appDiv = document.getElementById("app");

showLogin();

function showLogin(){

  appDiv.innerHTML = `
  <div class="h-screen flex items-center justify-center p-4">
    <div class="bg-[#202c33] p-8 rounded-xl w-full max-w-sm">

      <h1 class="text-3xl font-bold text-center mb-6">
      DOIRA
      </h1>

      <input
      id="nameInput"
      placeholder="Исмингиз"
      class="w-full p-3 rounded bg-[#2a3942] outline-none mb-4"
      >

      <button
      id="joinBtn"
      class="w-full bg-[#00a884] p-3 rounded font-bold">
      Кириш
      </button>

    </div>
  </div>
  `;

  document.getElementById("joinBtn").onclick = login;
}

async function login(){

  const name = document.getElementById("nameInput").value.trim();

  if(!name) return;

  localStorage.setItem("doira_name",name);

  await signInAnonymously(auth);
}

onAuthStateChanged(auth, async(user)=>{

  if(user){

    currentUser = user;
    currentName = localStorage.getItem("doira_name");

    await set(ref(db,"users/"+user.uid),{
      name:currentName,
      online:true,
      lastSeen:serverTimestamp()
    });

    onDisconnect(ref(db,"users/"+user.uid)).update({
      online:false
    });

    showChat();

  }

});

function showChat(){

  appDiv.innerHTML = `
  <div class="flex h-screen">

    <div class="sidebar" id="sidebar">

      <div class="bg-[#202c33] p-3">

        <div class="flex justify-between items-center">

          <div>
            <div class="font-bold">
            ${currentName}
            </div>

            <div class="text-xs text-green-400">
            online
            </div>
          </div>

          <button id="menuClose">
          ✖
          </button>

        </div>

        <input
        id="searchInput"
        placeholder="Қидириш..."
        class="w-full mt-3 p-2 rounded bg-[#2a3942] outline-none"
        >

      </div>

      <div id="usersList" class="overflow-y-auto h-[90vh]"></div>

    </div>

    <div class="chat-area">

      <div class="bg-[#202c33] p-3 flex items-center gap-3">

        <button id="menuBtn" class="md:hidden">
        ☰
        </button>

        <div id="chatTitle">
        Суҳбат танланг
        </div>

      </div>

      <div id="messages" class="messages p-3 flex flex-col gap-2"></div>

      <div class="bg-[#202c33] p-2 flex gap-2">

        <input
        id="msgInput"
        placeholder="Хабар..."
        class="flex-1 bg-[#2a3942] p-3 rounded outline-none"
        >

        <button
        id="sendBtn"
        class="bg-[#00a884] px-5 rounded">
        Юбор
        </button>

      </div>

    </div>

  </div>
  `;

  loadUsers();

  document.getElementById("menuBtn").onclick=()=>{
    document.getElementById("sidebar").classList.add("open");
  }

  document.getElementById("menuClose").onclick=()=>{
    document.getElementById("sidebar").classList.remove("open");
  }

  document.getElementById("sendBtn").onclick = sendMessage;

  document.getElementById("msgInput").addEventListener("keyup",(e)=>{
    if(e.key==="Enter"){
      sendMessage();
    }
  });

}

function loadUsers(){

  onValue(ref(db,"users"),(snap)=>{

    const data = snap.val() || {};

    const usersList = document.getElementById("usersList");

    usersList.innerHTML = "";

    Object.entries(data).forEach(([uid,user])=>{

      if(uid === currentUser.uid) return;

      const div = document.createElement("div");

      div.className =
      "p-3 border-b border-gray-800 cursor-pointer hover:bg-[#202c33]";

      div.innerHTML = `
      <div class="font-bold">${user.name}</div>
      <div class="text-xs ${user.online ? 'text-green-400':'text-gray-400'}">
      ${user.online ? 'online':'offline'}
      </div>
      `;

      div.onclick = ()=>{
        openChat(uid,user.name);
      }

      usersList.appendChild(div);

    });

  });

}

function openChat(uid,name){

  currentChat = [currentUser.uid,uid].sort().join("_");

  document.getElementById("chatTitle").textContent = name;

  const messagesDiv = document.getElementById("messages");

  messagesDiv.innerHTML = "";

  onValue(ref(db,"chats/"+currentChat),(snap)=>{

    const data = snap.val() || {};

    messagesDiv.innerHTML = "";

    Object.values(data).forEach(msg=>{

      const div = document.createElement("div");

      div.className =
      "max-w-[80%] p-3 rounded-lg text-sm " +
      (msg.sender===currentUser.uid
      ? "msg-out self-end"
      : "msg-in self-start");

      div.innerHTML = `
      <div>${msg.text}</div>
      <div class="text-[10px] text-gray-300 mt-1">
      ${msg.senderName}
      </div>
      `;

      messagesDiv.appendChild(div);

    });

    messagesDiv.scrollTop = messagesDiv.scrollHeight;

  });

}

async function sendMessage(){

  const input = document.getElementById("msgInput");

  const text = input.value.trim();

  if(!text || !currentChat) return;

  await push(ref(db,"chats/"+currentChat),{
    text,
    sender:currentUser.uid,
    senderName:currentName,
    time:serverTimestamp()
  });

  input.value = "";

}

</script>

</body>
</html>
