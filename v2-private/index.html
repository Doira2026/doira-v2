<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doira Private</title>
  <script src="https://tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; margin: 0; }
    .chat-bg { background: #0a1014; }
    .msg-out { background: #005c4b; }
    .msg-in { background: #202c33; }
    .main-wrap { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    .header-bar { flex-shrink: 0; }
    .messages-box { flex: 1; overflow-y: auto; }
    .input-bar { flex-shrink: 0; }
    .msg-menu { position: absolute; background: #1f2c34; border-radius: 8px; padding: 4px; z-index: 100; }
    .unread-badge { background: #ff3b30; color: white; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: bold; }
    @media (max-width: 768px) {
      .sidebar { position: fixed; z-index: 50; left: -100%; transition: 0.3s; width: 85%!important; height: 100vh; height: 100dvh; }
      .sidebar.open { left: 0; }
      .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
      .overlay.show { display: block; }
      .msg-img { max-width: 160px!important; }
      .msg-audio { max-width: 180px!important; }
      .msg-text { font-size: 14px; }
      .btn-icon { font-size: 18px!important; padding: 2px 4px!important; }
    }
    .recording { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="chat-bg text-white">

<div id="app"></div>
<audio id="notifSound" src="https://pixabay.com"></audio>

<script type="module">
  import { initializeApp } from 'https://gstatic.com';
  // КЕРАКЛИ ФУНКЦИЯЛАР ЯНГЛИЛАНДИ (createUserWithEmailAndPassword ва signInWithEmailAndPassword ҚЎШИЛДИ)
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from 'https://gstatic.com';
  import { getDatabase, ref, set, onValue, push, onDisconnect, serverTimestamp, remove, onChildAdded, update, get } from 'https://gstatic.com';

  const firebaseConfig = {
    apiKey: "AIzaSyAksQf3rkeG998TmJj-YuA3WpTDLLZ1ais",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebaseio.com",
    projectId: "doira-chat-v2",
    storageBucket: "doira-chat-v2.firebasestorage.app",
    messagingSenderId: "885552294238",
    appId: "1:885552294238:web:8a5d288d1eb57e11b687cf"
  };

  const IMGBB_API_KEY = 'e4cecebb229f451e3322c126e3d09399';
  const STICKERS = ['😀','😂','😍','😘','😎','😭','😡','👍','🔥','❤️','💯','🎉','🤔','🙏','👏','😴','💀','🤡','🥳','😇','😈','🤪','🥺','😱'];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentUserName = '';
  let currentChatId = null;
  let currentChatUser = null;
  let currentChatUid = null;
  let messagesUnsubscribe = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let allUsers = {};
  let friendsList = {};
  let unreadCounts = {};

  const appDiv = document.getElementById('app');
  const notifSound = document.getElementById('notifSound');

  let isRegisterMode = false; // Кириш ёки Рўйхатдан ўтиш режимини аниқлаш

  async function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }
  }

  // КИРИШ ВА РЎЙХАТДАН ЎТИШ ОЙНАСИ
  function showLogin() {
    appDiv.innerHTML = `
      <div class="flex items-center justify-center h-screen p-4">
        <div class="bg-[#1f2c34] p-8 rounded-lg w-full max-w-sm">
          <h1 class="text-3xl font-bold text-center mb-6">DOIRA</h1>
          <div id="loginError" class="text-red-500 text-xs text-center mb-3 hidden"></div>
          
          <input id="emailInput" type="email" placeholder="Email ёки Логин (масалан: user@mail.com)"
            class="w-full bg-[#2a3942] p-3 rounded mb-3 outline-none text-sm">
          
          <input id="passwordInput" type="password" placeholder="Пароль (камида 6 та белги)"
            class="w-full bg-[#2a3942] p-3 rounded mb-3 outline-none text-sm">

          <div id="nameInputWrapper" class="hidden">
            <input id="nameInput" type="text" placeholder="Исмингиз (Чат учун)"
              class="w-full bg-[#2a3942] p-3 rounded mb-4 outline-none text-sm">
          </div>
            
          <button id="authBtn" class="w-full bg-[#00a884] p-3 rounded font-bold transition hover:bg-[#008f72] mb-4">Кириш</button>
          
          <p class="text-xs text-center text-gray-400">
            <span id="toggleText">Ҳали рўйхатдан ўтмаганмисиз?</span>
            <a id="toggleAuthMode" href="#" class="text-[#00a884] ml-1 font-semibold underline">Рўйхатдан ўтиш</a>
          </p>
        </div>
      </div>
    `;

    document.getElementById('authBtn').onclick = handleAuth;
    document.getElementById('toggleAuthMode').onclick = toggleMode;

    const inputs = ['emailInput', 'passwordInput', 'nameInput'];
    inputs.forEach(id => {
      document.getElementById(id).onkeyup = e => e.key === 'Enter' && handleAuth();
    });
  }

  function toggleMode(e) {
    e.preventDefault();
    isRegisterMode = !isRegisterMode;
    const nameWrapper = document.getElementById('nameInputWrapper');
    const authBtn = document.getElementById('authBtn');
    const toggleText = document.getElementById('toggleText');
    const toggleLink = document.getElementById('toggleAuthMode');
    const errorDiv = document.getElementById('loginError');

    errorDiv.classList.add('hidden');

    if (isRegisterMode) {
      nameWrapper.classList.remove('hidden');
      authBtn.textContent = 'Рўйхатдан ўтиш';
      toggleText.textContent = 'Аккаунтингиз борми?';
      toggleLink.textContent = 'Кириш';
    } else {
      nameWrapper.classList.add('hidden');
      authBtn.textContent = 'Кириш';
      toggleText.textContent = 'Ҳали рўйхатдан ўтмаганмисиз?';
      toggleLink.textContent = 'Рўйхатдан ўтиш';
    }
  }

  async function handleAuth() {
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passwordInput').value.trim();
    const errorDiv = document.getElementById('loginError');

    if (!email || !pass) {
      errorDiv.textContent = "Барча майдонларни тўлдиринг!";
      errorDiv.classList.remove('hidden');
      return;
    }

    if (pass.length < 6) {
      errorDiv.textContent = "Пароль камида 6 та белгидан иборат бўлиши керак!";
      errorDiv.classList.remove('hidden');
      return;
    }

    try {
      errorDiv.classList.add('hidden');
      await requestNotificationPermission();

      if (isRegisterMode) {
        // РЎЙХАТДАН ЎТИШ РЕЖИМИ
        const name = document.getElementById('nameInput').value.trim();
        if (!name) {
          errorDiv.textContent = "Илтимос, исмингизни киритинг!";
          errorDiv.classList.remove('hidden');
          return;
        }
        
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(userCredential.user, { displayName: name });
        localStorage.setItem('doira_name', name);
        
        // Маълумотлар базасига фойдаланувчини ёзиш
        await set(ref(db, `users/${userCredential.user.uid}`), {
          uid: userCredential.user.uid,
          name: name,
          online: true,
          lastSeen: serverTimestamp()
        });

      } else {
        // КИРИШ РЕЖИМИ
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        const userSnap = await get(ref(db, `users/${userCredential.user.uid}`));
        let savedName = userCredential.user.displayName || 'Аноним';
        if (userSnap.exists() && userSnap.val().name) {
          savedName = userSnap.val().name;
        }
        localStorage.setItem('doira_name', savedName);
      }
    } catch (error) {
      console.error(error);
      if (error.code === 'auth/email-already-in-use') {
        errorDiv.textContent = "Бу email аллақачон рўйхатдан ўтган!";
      } else if (error.code === 'auth/invalid-email') {
        errorDiv.textContent = "Email шакли нотўғри (масалан: user@mail.com бўлиши шарт)!";
      } else if (error.code === 'auth/invalid-credential') {
        errorDiv.textContent = "Email ёки парол хато!";
      } else {
        errorDiv.textContent = "Хатолик юз берди: " + error.message;
      }
      errorDiv.classList.remove('hidden');
    }
  }

  function showChat() {
    appDiv.innerHTML = `
      <div class="overlay" id="overlay"></div>
      <div class="flex h-screen">
        <div class="sidebar w-1/3 bg-[#111b21] border-r border-gray-700 md:relative md:left-0" id="sidebar">
          <div class="bg-[#202c33] p-3 header-bar">
            <div class="flex justify-between items-center mb-2">
              <h1 class="text-lg font-bold">DOIRA</h1>
              <button id="logoutBtn" class="bg-red-600 px-2 py-1 rounded text-xs">Чиқиш</button>
            </div>
            <div id="myProfile" class="bg-[#2a3942] p-2 rounded flex items-center gap-2 cursor-pointer">
              <div class="w-8 h-8 bg-[#00a884] rounded-full flex items-center justify-center text-sm font-bold">👤</div>
              <div class="flex-1">
                <div class="text-xs text-gray-400">Сен:</div>
                <div id="myName" class="text-sm font-bold"></div>
              </div>
              <div class="text-xs">✏️</div>
            </div>
            <input id="searchInput" type="text" placeholder="🔍 Қидириш..."
              class="w-full bg-[#2a3942] p-2 rounded mt-2 outline-none text-sm">
          </div>
          <div id="usersList" class="overflow-y-auto" style="height: calc(100vh - 140px); height: calc(100dvh - 140px);"></div>
        </div>
        <div class="flex-1 main-wrap bg-[#0b141a] w-full">
          <div id="chatHeader" class="bg-[#202c33] p-3 flex items-center gap-3 header-bar">
            <button id="menuBtn" class="md:hidden text-2xl">☰</button>
            <span id="chatHeaderText" class="font-bold text-sm">Суҳбатдошни танланг</span>
          </div>
          <div id="messages" class="messages-box p-2"></div>
          <div id="stickerPanel" class="bg-[#202c33] p-2 hidden grid grid-cols-8 gap-1 max-h-28 overflow-y-auto input-bar"></div>
          <div id="inputArea" class="bg-[#202c33] p-2 hidden input-bar">
            <div class="flex gap-1 items-center">
              <button id="attachBtn" class="btn-icon text-lg px-1">📎</button>
              <button id="stickerBtn" class="btn-icon text-lg px-1">😊</button>
              <input id="msgInput" type="text" placeholder="Хабар..."
                class="flex-1 bg-[#2a3942] p-2 rounded outline-none text-sm">
              <button id="micBtn" class="btn-icon text-lg px-1">🎤</button>
              <button id="sendBtn" class="bg-[#00a884] px-3 py-2 rounded text-xs">Юбор</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
          </div>
        </div>
      </div>
    `;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('stickerBtn').onclick = toggleStickers;
    document.getElementById('micBtn').onclick = toggleRecording;
    document.getElementById('fileInput').onchange = uploadFile;
    document.getElementById('menuBtn').onclick = toggleSidebar;
    document.getElementById('overlay').onclick = toggleSidebar;
    document.getElementById('searchInput').oninput = renderUsers;
    document.getElementById('myProfile').onclick = changeName;
    document.getElementById('myName').textContent = currentUserName;
    loadStickers();
    loadUsers();
    loadUnreadCounts();
  }

  window.changeName = async () => {
    const newName = prompt('Янги исм киритинг:', currentUserName);
    if (!newName || newName.trim() === '' || newName === currentUserName) return;
    const name = newName.trim();
    localStorage.setItem('doira_name', name);
    currentUserName = name;
    currentUser.displayName = name;
    document.getElementById('myName').textContent = name;
    await update(ref(db, `users/${currentUser.uid}`), { name });
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      currentUserName = localStorage.getItem('doira_name') || user.displayName || 'Аноним';
      showChat();
    } else {
      showLogin();
    }
  });

  function logout() {
    auth.signOut();
  }
</script>
</body>
</html>
