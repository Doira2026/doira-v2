<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; }
       .chat { max-width: 600px; margin: 20px auto; background: white; border-radius: 10px; overflow: hidden; }
       .header { background: #0084ff; color: white; padding: 15px; font-weight: bold; }
       .messages { height: 400px; overflow-y: auto; padding: 10px; }
       .msg { margin: 10px 0; display: flex; }
       .msg.user { justify-content: flex-end; }
       .bubble { max-width: 70%; padding: 10px 15px; border-radius: 18px; word-wrap: break-word; }
       .msg.user.bubble { background: #0084ff; color: white; }
       .msg.bot.bubble { background: #e4e6eb; color: black; }
       .bubble img { max-width: 200px; border-radius: 10px; display: block; margin-top: 5px; }
       .input { display: flex; padding: 10px; border-top: 1px solid #ddd; align-items: center; }
       .input input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
       .input button { margin-left: 8px; padding: 10px 15px; border: none; background: #0084ff; color: white; border-radius: 20px; cursor: pointer; }
        #fileInput { display: none; }
       .fileBtn { font-size: 24px; cursor: pointer; padding: 0 10px; color: #0084ff; }
    </style>
</head>
<body>
    <div class="chat">
        <div class="header">Doira2026 Chat</div>
        <div class="messages" id="messages"></div>
        <div class="input">
            <label for="fileInput" class="fileBtn">📎</label>
            <input type="file" id="fileInput" accept="image/*">
            <input type="text" id="textInput" placeholder="Xabar yozing...">
            <button onclick="sendText()">Yuborish</button>
        </div>
    </div>

    <script>
        const IMGBB_API_KEY = 'e4cecebb229f451e3322c126e3d09399';
        const messages = document.getElementById('messages');
        const fileInput = document.getElementById('fileInput');
        const textInput = document.getElementById('textInput');

        fileInput.addEventListener('change', uploadImage);

        function addMessage(text, isUser, imageUrl = null) {
            const msg = document.createElement('div');
            msg.className = 'msg ' + (isUser? 'user' : 'bot');
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (text) bubble.innerText = text;
            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                bubble.appendChild(img);
            }
            msg.appendChild(bubble);
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        function sendText() {
            const text = textInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            textInput.value = '';
            setTimeout(() => addMessage('Xabaringiz qabul qilindi 👍', false), 500);
        }

        async function uploadImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            addMessage('Rasm yuklanyapti...', true);

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    messages.lastChild.remove(); // "yuklanyapti" ni o'chir
                    addMessage(null, true, data.data.url);
                    setTimeout(() => addMessage('Rasm qabul qilindi ✅', false), 500);
                } else {
                    messages.lastChild.remove();
                    addMessage('Xatolik: Rasm yuklanmadi', false);
                }
            } catch (err) {
                messages.lastChild.remove();
                addMessage('Xatolik: ' + err.message, false);
            }
            fileInput.value = '';
        }

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendText();
        });

        addMessage('Salom! Rasm yuborish uchun 📎 bosing', false);
    </script>
</body>
</html>
