<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doira v2 - Private Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
        font-family: 'Inter', sans-serif;
        scrollbar-width: thin;
        scrollbar-color: #4b5563 #1f2937;
    }
    
    *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    
    *::-webkit-scrollbar-track {
        background: #1f2937;
    }
    
    *::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 3px;
    }
    
    .gradient-bg {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .glass-effect {
        background: rgba(31, 41, 55, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .message-bubble {
        animation: slideIn 0.2s ease-out;
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .typing-indicator span {
        animation: blink 1.4s infinite both;
    }
    
    .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
    }
    
    .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
    }
    
    @keyframes blink {
        0%, 80%, 100% { opacity: 0.3; }
        40% { opacity: 1; }
    }
    
    .emoji-picker {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
    }
    
    .dark {
        color-scheme: dark;
    }
    
    .light {
        --tw-bg-opacity: 1;
        background-color: rgba(243, 244, 246, var(--tw-bg-opacity));
        color: #111827;
    }
    
    .light .glass-effect {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.1);
    }
    
    .light ::-webkit-scrollbar-track {
        background: #e5e7eb;
    }
    
    .light ::-webkit-scrollbar-thumb {
        background-color: #9ca3af;
    }
    
    .context-menu {
        animation: fadeIn 0.1s ease-out;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
    
    .recording-pulse {
        animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
</style>
</head>
<body class="dark bg-gray-900 text-gray-100 h-screen overflow-hidden">
<div id="app" class="h-full flex flex-col">

<!-- Firebase -->
<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getDatabase, ref, set, get, push, onValue, update, remove, serverTimestamp, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';
    
    const firebaseConfig = {
        apiKey: "AIzaSyBQq8J8x8x8x8x8",
        authDomain: "doira-6eae8.firebaseapp.com",
        databaseURL: "https://doira-6eae8-default-rtdb.firebaseio.com",
        projectId: "doira-6eae8",
        storageBucket: "doira-6eae8.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef123456"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);
    
    // Global State
    let currentUser = null;
    let currentChatId = null;
    let currentChatType = null;
    let selectedMessageId = null;
    let replyingTo = null;
    let editingMsgId = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let typingTimeout = null;
    let messagesListener = null;
    let presenceRef = null;
    
    const emojis = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','👍','👎','👊','✊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💅','🤳','💪','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟'];
    
    window.db = db;
    window.push = push;
    window.ref = ref;
    window.set = set;
    window.get = get;
    window.update = update;
    window.remove = remove;
    window.serverTimestamp = serverTimestamp;
    window.onValue = onValue;
    window.onDisconnect = onDisconnect;
    window.storage = storage;
    window.storageRef = storageRef;
    window.uploadBytes = uploadBytes;
    window.getDownloadURL = getDownloadURL;
    
    // Auth Functions
    window.toggleAuth = () => {
        document.getElementById('loginForm').classList.toggle('hidden');
        document.getElementById('registerForm').classList.toggle('hidden');
    };
    
    window.loginUser = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) return alert('Barcha maydonlarni to\'ldiring');
        
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            alert('Kirish xatosi: ' + error.message);
        }
    };
    
    window.registerUser = async () => {
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        if (!username || !email || !password) return alert('Barcha maydonlarni to\'ldiring');
        
        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            
            await set(ref(db, `users/${user.uid}`), {
                username: username,
                email: email,
                avatar: '',
                status: 'Yangi foydalanuvchi',
                createdAt: serverTimestamp(),
                lastSeen: serverTimestamp()
            });
        } catch (error) {
            alert('Ro\'yxatdan o\'tish xatosi: ' + error.message);
        }
    };
    
    window.logoutUser = async () => {
        if (presenceRef) await set(presenceRef, false);
        await signOut(auth);
    };
    
    // Auth State Observer
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;

        const messagesPath = type === 'private' ? `messages/${chatId}` : `groupMessages/${chatId}`;
        const messagesRef = ref(db, messagesPath);
        
        messagesListener = onValue(messagesRef, async (snapshot) => {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div id="typingIndicator" class="hidden text-sm text-gray-400 italic"><span class="typing-indicator"><span>•</span><span>•</span><span>•</span></span> yozmoqda...</div>';
            
            if (!snapshot.exists()) return;
            
            const messages = [];
            snapshot.forEach(child => {
                messages.push({ id: child.key, ...child.val() });
            });
            
            for (const msg of messages) {
                const msgEl = await createMessageElement(msg);
                container.insertBefore(msgEl, document.getElementById('typingIndicator'));
            }
            
            container.scrollTop = container.scrollHeight;
        });
        
        // Listen to typing
        const typingRef = ref(db, `${messagesPath.replace('messages', 'typing')}`);
        onValue(typingRef, (snapshot) => {
            if (snapshot.exists()) {
                const typing = snapshot.val();
                const otherTyping = Object.entries(typing).find(([uid, isTyping]) => uid !== currentUser.uid && isTyping);
                document.getElementById('typingIndicator').classList.toggle('hidden', !otherTyping);
            }
        });
    };
    
    async function createMessageElement(msg) {
        const isOwn = msg.senderId === currentUser.uid;
        const senderSnap = await get(ref(db, `users/${msg.senderId}`));
        const senderData = senderSnap.exists() ? senderSnap.val() : { username: 'Unknown' };
        
        const div = document.createElement('div');
        div.className = `message-bubble flex ${isOwn ? 'justify-end' : 'justify-start'}`;
        div.dataset.msgid = msg.id;
        
        let content = '';
        if (msg.replyTo) {
            content += `<div class="text-xs text-purple-400 mb-1 border-l-2 border-purple-500 pl-2">${msg.replyTo.text}</div>`;
        }
        
        if (msg.type === 'text') {
            content += `<p class="break-words">${msg.text}</p>`;
        } else if (msg.type === 'image') {
            content += `<img src="${msg.fileUrl}" class="max-w-xs rounded-lg cursor-pointer" onclick="window.open('${msg.fileUrl}')">`;
        } else if (msg.type === 'audio') {
            content += `<audio controls src="${msg.fileUrl}" class="max-w-xs"></audio>`;
        } else if (msg.type === 'file') {
            content += `<a href="${msg.fileUrl}" target="_blank" class="flex items-center gap-2 text-blue-400 hover:text-blue-300"><i class="fa-solid fa-file"></i> ${msg.fileName}</a>`;
        }
        
        if (msg.edited) {
            content += `<span class="text-xs text-gray-500 ml-2">(tahrirlangan)</span>`;
        }
        
        const reactions = msg.reactions ? Object.entries(msg.reactions).map(([emoji, users]) => 
            `<span class="text-xs bg-gray-800 px-2 py-1 rounded-full">${emoji} ${Object.keys(users).length}</span>`
        ).join(' ') : '';
        
        div.innerHTML = `
            <div class="max-w-md ${isOwn ? 'bg-purple-600' : 'bg-gray-800'} rounded-2xl px-4 py-2 shadow-lg" oncontextmenu="showContextMenu(event, '${msg.id}', ${isOwn})">
                ${!isOwn ? `<p class="text-xs font-semibold text-purple-400 mb-1">${senderData.username}</p>` : ''}
                ${content}
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-xs text-gray-400">${formatTime(msg.timestamp)}</span>
                    ${reactions ? `<div class="flex gap-1">${reactions}</div>` : ''}
                </div>
            </div>
        `;
        
        return div;
    }

    // Voice Recording
    window.startRecording = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const fileUrl = await uploadFile(blob, `audio_${Date.now()}.webm`);
                if (fileUrl) {
                    sendFileMessage(fileUrl, 'audio', 'Audio xabar');
                }
                stream.getTracks().forEach(track => track.stop());
            };
            
            mediaRecorder.start();
            document.getElementById('recordBtn').classList.add('recording-pulse', 'bg-red-600');
        } catch (error) {
            alert('Mikrofon ruxsati berilmadi');
        }
    };
    
    window.stopRecording = () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            document.getElementById('recordBtn').classList.remove('recording-pulse', 'bg-red-600');
        }
    };

    window.startChatWith = async (userId) => {
        // Check if chat exists
        const userChatsSnap = await get(ref(db, `userChats/${currentUser.uid}`));
        let existingChatId = null;
        
        if (userChatsSnap.exists()) {
            for (const chatId of Object.keys(userChatsSnap.val())) {
                const chatSnap = await get(ref(db, `chats/${chatId}`));
                if (chatSnap.exists() && chatSnap.val().members[userId]) {
                    existingChatId = chatId;
                    break;
                }
            }
        }
        
        if (existingChatId) {
            const userSnap = await get(ref(db, `users/${userId}`));
            openChat(existingChatId, 'private', userSnap.val());
        } else {
            // Create new chat
            const newChatRef = push(ref(db, 'chats'));
            const chatId = newChatRef.key;
            
            await set(newChatRef, {
                members: {
                    [currentUser.uid]: true,
                    [userId]: true
                },
                createdAt: serverTimestamp()
            });
            
            await set(ref(db, `userChats/${currentUser.uid}/${chatId}`), true);
            await set(ref(db, `userChats/${userId}/${chatId}`), true);
            
            const userSnap = await get(ref(db, `users/${userId}`));
            openChat(chatId, 'private', userSnap.val());
        }
        
        document.getElementById('searchInput').value = '';
    };

            createdAt: serverTimestamp()
        });
        
        await set(ref(db, `userGroups/${currentUser.uid}/${groupId}`), true);
        
        closeModal('newChatModal');
        document.getElementById('groupNameInput').value = '';
        document.getElementById('groupDescInput').value = '';
    };
    
    // Settings
    window.showSettings = () => {
        document.getElementById('settingsModal').classList.remove('hidden');
        get(ref(db, `users/${currentUser.uid}`)).then(snap => {
            if (snap.exists()) {
                const data = snap.val();
                document.getElementById('avatarUrlInput').value = data.avatar || '';
                document.getElementById('statusInput').value = data.status || '';
            }
        });
    };
    
    window.saveProfile = async () => {
        const avatar = document.getElementById('avatarUrlInput').value;
        const status = document.getElementById('statusInput').value;
        
        await update(ref(db, `users/${currentUser.uid}`), { avatar, status });
        alert('Profil yangilandi');
        closeModal('settingsModal');
        location.reload();
    };
    
    // Theme
    window.toggleTheme = () => {
        document.body.classList.toggle('dark');
        document.body.classList.toggle('light');
        const isDark = document.body.classList.contains('dark');
        document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };
    
    // Load theme
    if (localStorage.getItem('theme') === 'light') {
        document.body.classList.remove('dark');
        document.body.classList.add('light');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }
    
    // Tabs
    window.switchTab = (tab) => {
        document.getElementById('tabChats').classList.remove('bg-purple-600');
        document.getElementById('tabGroups').classList.remove('bg-purple-600');
        document.getElementById('tabFriends').classList.remove('bg-purple-600');
        
        document.getElementById('chatsList').classList.add('hidden');
        document.getElementById('groupsList').classList.add('hidden');
        document.getElementById('friendsList').classList.add('hidden');
        
        if (tab === 'chats') {
            document.getElementById('tabChats').classList.add('bg-purple-600');
            document.getElementById('chatsList').classList.remove('hidden');
        } else if (tab === 'groups') {
            document.getElementById('tabGroups').classList.add('bg-purple-600');
            document.getElementById('groupsList').classList.remove('hidden');
        } else {
            document.getElementById('tabFriends').classList.add('bg-purple-600');
            document.getElementById('friendsList').classList.remove('hidden');
        }
    };
    
    window.showChatInfo = () => {
        alert('Chat ma\'lumotlari tez orada...');
    };
    
    // Utils
    function formatTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'hozir';
        if (diff < 3600000) return Math.floor(diff / 60000) + ' daq';
        if (diff < 86400000) return Math.floor(diff / 3600000) + ' soat';
        
        return date.toLocaleDateString('uz-UZ', { day: 'numeric', month: 'short' });
    }
    
    // Init
    console.log('Doira v2 initialized');
</script>
</body>
</html>
