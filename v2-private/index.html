<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOIRA Чат - Private</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0e1621; color: #fff; height: 100vh; overflow: hidden; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 320px; background: #17212b; border-right: 1px solid #0e1621; display: flex; flex-direction: column; transition: 0.3s; }
    .header { padding: 12px 16px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .logout { background: #e53935; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid #0e1621; transition: 0.2s; }
    .user-item:hover { background: #202b36; }
    .user-item.active { background: #2b5278; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: #5288c1; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .user-info { flex: 1; }
    .user-name { font-size: 15px; margin-bottom: 2px; }
    .user-status { font-size: 12px; color: #708499; display: flex; align-items: center; gap: 4px; }
    .online-dot { width: 8px; height: 8px; background: #4dcd5e; border-radius: 50%; }
    .chat { flex: 1; display: flex; flex-direction: column; background: #0e1621; }
    .chat-header { padding: 12px 16px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; gap: 12px; }
    .back-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .chat-name { font-size: 16px; font-weight: 500; }
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background-image: url('https://web.telegram.org/a/chat-bg-pattern-dark.ad38368a9e8140d0ac7d.png'); }
    .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; position: relative; word-wrap: break-word; animation: fadeIn 0.2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } }
    .msg.me { align-self: flex-end; background: #2b5278; border-bottom-right-radius: 4px; }
    .msg.other { align-self: flex-start; background: #182533; border-bottom-left-radius: 4px; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 4px; }
    .msg-time { font-size: 11px; color: #708499; margin-top: 4px; text-align: right; }
    .delete-btn { position: absolute; top: -8px; right: -8px; background: #e53935; border: none; color: white; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; cursor: pointer; display: none; }
    .msg:hover .delete-btn { display: block; }
    .deleted-msg { font-style: italic; color: #708499; }
    .input-area { padding: 8px 12px; background: #17212b; display: flex; gap: 8px; align-items: flex-end; }
    .input-area input[type="text"] { flex: 1; background: #242f3d; border: none; color: #fff; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 15px; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: #5288c1; border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn:active { transform: scale(0.95); }
    #fileInput { display: none; }
    @media (max-width: 768px) { .sidebar { position: absolute; width: 100%; z-index: 10; } .sidebar.hidden { transform: translateX(-100%); } .back-btn { display: block; } .msg { max-width: 85%; } }
    .welcome { flex: 1; display: flex; align-items: center; justify-content: center; color: #708499; font-size: 16px; }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #323232; color: white; padding: 12px 20px; border-radius: 8px; z-index: 1000; animation: slideUp 0.3s; }
    @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } }
    .login-screen { position: fixed; inset: 0; background: #0e1621; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: #17212b; padding: 30px; border-radius: 16px; width: 90%; max-width: 320px; }
    .login-box h2 { margin-bottom: 20px; text-align: center; }
    .login-box input { width: 100%; padding: 12px; background: #242f3d; border: none; border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 12px; }
    .login-box button { width: 100%; padding: 12px; background: #5288c1; border: none; border-radius: 10px; color: #fff; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h2>DOIRA Чатга кириш</h2>
      <input type="text" id="nameInput" placeholder="Исмингизни ёзинг" maxlength="20">
      <button onclick="doLogin()">Кириш</button>
    </div>
  </div>

  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="header">
        <h1>DOIRA Чат</h1>
        <button class="logout" onclick="logout()">Чиқиш</button>
      </div>
      <div class="user-list" id="userList"></div>
    </div>
    <div class="chat" id="chatArea">
      <div class="welcome" id="welcome">Суҳбатдошни танланг</div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*,audio/*">

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, push, onValue, set, remove, onDisconnect, serverTimestamp, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // 1. FIREBASE CONFIG - БУНИ АЛБАТТА ЎЗИНГНИКИГА АЛМАШТИР!
    // doira-chat-v2 лойиҳангдан олиб қўй
    const firebaseConfig = {
      apiKey: "AIzaSyDbsDFe8L_v-H_dKCv5m3rYWUOnymKJi14",
      authDomain: "doira-chat-v2.firebaseapp.com",
      databaseURL: "https://doira-chat-v2-default-rtdb.firebaseio.com",
      projectId: "doira-chat-v2",
      storageBucket: "doira-chat-v2.appspot.com",
      messagingSenderId: "24569627793",
      appId: "1:24569627793:web:b1a8acb36d17adc180ab30"
    };

    // 2. CLOUDINARY CONFIG
    const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dkq3c5xrs/upload';
    const CLOUDINARY_PRESET = 'doira_chat';

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = null;
    let currentChatId = null;
    let currentChatUser = null;

    // Кириш ойнаси
    window.doLogin = () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert('Исм киритинг!');
        return;
      }
      localStorage.setItem('doira_name', name);
      document.getElementById('loginScreen').style.display = 'none';
      startApp(name);
    }

    // Агар аввал кирган бўлса
    window.onload = () => {
      const savedName = localStorage.getItem('doira_name');
      if (savedName) {
        document.getElementById('loginScreen').style.display = 'none';
        startApp(savedName);
      }
    }

    function startApp(name) {
      currentUser = {
        id: btoa(name).replace(/=/g, ''),
        name: name
      };
      const userRef = ref(db, `users/${currentUser.id}`);
      set(userRef, { name: currentUser.name, online: true, lastSeen: serverTimestamp() });
      onDisconnect(userRef).update({ online: false, lastSeen: serverTimestamp() });
      loadUsers();
      listenNotifications();
    }

    function loadUsers() {
      onValue(ref(db, 'users'), (snapshot) => {
        const users = snapshot.val() || {};
        const list = document.getElementById('userList');
        list.innerHTML = '';
        Object.entries(users).forEach(([id, user]) => {
          if (id === currentUser.id) return;
          const div = document.createElement('div');
          div.className = 'user-item';
          div.onclick = () => openChat(id, user.name);
          div.innerHTML = `
            <div class="avatar">${user.name[0].toUpperCase()}</div>
            <div class="user-info">
              <div class="user-name">${user.name}</div>
              <div class="user-status">
                ${user.online ? '<span class="online-dot"></span> Онлайн' : 'Оффлайн'}
              </div>
            </div>
          `;
          list.appendChild(div);
        });
      });
    }

    window.openChat = (userId, userName) => {
      currentChatUser = { id: userId, name: userName };
      currentChatId = [currentUser.id, userId].sort().join('_');
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('sidebar').classList.add('hidden');
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = `
        <div class="chat-header">
          <button class="back-btn" onclick="closeChat()">←</button>
          <div class="avatar">${userName[0].toUpperCase()}</div>
          <div class="chat-name">${userName}</div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
          <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
          <input type="text" id="msgInput" placeholder="Хабар ёзинг..." onkeydown="if(event.key==='Enter')sendMessage()">
          <button class="icon-btn" onclick="sendMessage()">➤</button>
        </div>
      `;
      loadMessages();
    }

    window.closeChat = () => {
      document.getElementById('sidebar').classList.remove('hidden');
      currentChatId = null;
    }

    function loadMessages() {
      const msgsRef = ref(db, `messages/${currentChatId}`);
      onValue(msgsRef, (snapshot) => {
        const msgs = snapshot.val() || {};
        const container = document.getElementById('messages');
        if (!container) return;
        container.innerHTML = '';
        Object.entries(msgs).forEach(([key, msg]) => {
          const div = document.createElement('div');
          div.className = `msg ${msg.senderId === currentUser.id ? 'me' : 'other'}`;
          if (msg.deleted) {
            div.innerHTML = `<div class="deleted-msg">Хабар ўчирилди</div>`;
          } else {
            let content = msg.text || '';
            if (msg.imageUrl) content += `<img src="${msg.imageUrl}">`;
            if (msg.audioUrl) content += `<audio controls src="${msg.audioUrl}"></audio>`;
            div.innerHTML = `
              ${content}
              <div class="msg-time">${new Date(msg.timestamp).toLocaleTimeString('uz', {hour: '2-digit', minute:'2-digit'})}</div>
              ${msg.senderId === currentUser.id ? `<button class="delete-btn" onclick="deleteMessage('${key}')">×</button>` : ''}
            `;
          }
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    window.sendMessage = () => {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !currentChatId) return;
      push(ref(db, `messages/${currentChatId}`), {
        text: text,
        senderId: currentUser.id,
        senderName: currentUser.name,
        timestamp: Date.now()
      });
      input.value = '';
    }

    document.getElementById('fileInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file || !currentChatId) return;
      showToast('Юклянмоқда...');
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_PRESET);
      try {
        const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
        const data = await res.json();
        const msgData = { senderId: currentUser.id, senderName: currentUser.name, timestamp: Date.now() };
        if (file.type.startsWith('image/')) msgData.imageUrl = data.secure_url;
        if (file.type.startsWith('audio/')) msgData.audioUrl = data.secure_url;
        push(ref(db, `messages/${currentChatId}`), msgData);
        showToast('Юборилди');
      } catch (err) {
        showToast('Хатолик юз берди');
      }
      e.target.value = '';
    }

    window.deleteMessage = async (msgKey) => {
      if (!confirm('Хабарни ўчирасизми?')) return;
      await update(ref(db, `messages/${currentChatId}/${msgKey}`), { deleted: true, deletedBy: currentUser.name });
      showToast('Хабар ўчирилди');
      push(ref(db, `notifications/${currentChatUser.id}`), {
        text: `${currentUser.name} хабарни ўчирди`,
        timestamp: Date.now()
      });
    }

    function listenNotifications() {
      onValue(ref(db, `notifications/${currentUser.id}`), (snapshot) => {
        const notifs = snapshot.val();
        if (!notifs) return;
        Object.entries(notifs).forEach(([key, notif]) => {
          showToast(notif.text);
          remove(ref(db, `notifications/${currentUser.id}/${key}`));
        });
      });
    }

    function showToast(text) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = text;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    window.logout = () => {
      update(ref(db, `users/${currentUser.id}`), { online: false });
      localStorage.removeItem('doira_name');
      location.reload();
    }
  </script>
</body>
</html>
