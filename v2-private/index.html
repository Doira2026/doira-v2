<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doira Private</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; margin: 0; }
.chat-bg { background: #0a1014; }
.msg-out { background: #005c4b; }
.msg-in { background: #202c33; }
.main-wrap { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.header-bar { flex-shrink: 0; }
.messages-box { flex: 1; overflow-y: auto; }
.input-bar { flex-shrink: 0; }
.msg-menu { position: absolute; background: #1f2c34; border-radius: 8px; padding: 4px; z-index: 100; }
.img-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; align-items: center; justify-content: center; }
  @media (max-width: 768px) {
 .sidebar { position: fixed; z-index: 50; left: -100%; transition: 0.3s; width: 85%!important; height: 100vh; height: 100dvh; }
 .sidebar.open { left: 0; }
 .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
 .overlay.show { display: block; }
 .msg-img { max-width: 160px!important; }
 .msg-audio { max-width: 180px!important; }
 .msg-text { font-size: 14px; }
 .btn-icon { font-size: 18px!important; padding: 2px 4px!important; }
   }
.recording { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="chat-bg text-white">

<div id="app"></div>
<div id="imgViewer" class="img-viewer hidden" onclick="closeImgViewer()">
  <img id="viewerImg" class="max-w-[90%] max-h-[90%]">
  <button onclick="downloadImg()" class="absolute top-4 right-4 bg-[#00a884] px-4 py-2 rounded">Скачат</button>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getDatabase, ref, set, onValue, push, onDisconnect, serverTimestamp, remove, onChildAdded } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAksQf3rkeG998TmJj-YuA3WpTDLLZ1ais",
    authDomain: "doira-chat-v2.firebaseapp.com",
    databaseURL: "https://doira-chat-v2-default-rtdb.firebaseio.com",
    projectId: "doira-chat-v2",
    storageBucket: "doira-chat-v2.firebasestorage.app",
    messagingSenderId: "885552294238",
    appId: "1:885552294238:web:8a5d288d1eb57e11b687cf"
  };

  const IMGBB_API_KEY = 'e4cecebb229f451e3322c126e3d09399';
  const CATBOX_URL = 'https://catbox.moe/user/api.php';
  const STICKERS = ['😀','😂','😍','😘','😎','😭','😡','👍','🔥','❤️','💯','🎉','🤔','🙏','👏','😴','💀','🤡','🥳','😇','😈','🤪','🥺','😱'];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentChatId = null;
  let messagesUnsubscribe = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let currentViewerUrl = '';
  let notificationEnabled = false;

  const appDiv = document.getElementById('app');

  // Уведомления рухсат сўраш
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(p => { notificationEnabled = p === 'granted'; });
  } else if (Notification.permission === 'granted') {
    notificationEnabled = true;
  }

  function showLogin() {
    appDiv.innerHTML = `
      <div class="flex items-center justify-center h-screen p-4">
        <div class="bg-[#1f2c34] p-8 rounded-lg w-full max-w-sm">
          <h1 class="text-3xl font-bold text-center mb-6">DOIRA</h1>
          <input id="nameInput" type="text" placeholder="Исмингизни киритинг"
            class="w-full bg-[#2a3942] p-3 rounded mb-4 outline-none">
          <button id="joinBtn" class="w-full bg-[#00a884] p-3 rounded font-bold">Кириш</button>
        </div>
      </div>
    `;
    document.getElementById('joinBtn').onclick = join;
    document.getElementById('nameInput').onkeyup = e => e.key === 'Enter' && join();
  }

  async function join() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    localStorage.setItem('doira_name', name);
    await signInAnonymously(auth);
  }

  function showChat() {
    appDiv.innerHTML = `
      <div class="overlay" id="overlay"></div>
      <div class="flex h-screen">
        <div class="sidebar w-1/3 bg-[#111b21] border-r border-gray-700 md:relative md:left-0" id="sidebar">
          <div class="bg-[#202c33] p-4 flex justify-between items-center header-bar">
            <h1 class="text-xl font-bold">DOIRA Чат</h1>
            <button id="logoutBtn" class="bg-red-600 px-3 py-1.5 rounded text-xs">Чиқиш</button>
          </div>
          <div id="usersList" class="overflow-y-auto" style="height: calc(100vh - 64px); height: calc(100dvh - 64px);"></div>
        </div>
        <div class="flex-1 main-wrap bg-[#0b141a] w-full">
          <div id="chatHeader" class="bg-[#202c33] p-3 flex items-center gap-3 header-bar">
            <button id="menuBtn" class="md:hidden text-2xl">☰</button>
            <span id="chatHeaderText" class="font-bold text-sm">Суҳбатдошни танланг</span>
          </div>
          <div id="messages" class="messages-box p-2"></div>
          <div id="stickerPanel" class="bg-[#202c33] p-2 hidden grid grid-cols-8 gap-1 max-h-28 overflow-y-auto input-bar"></div>
          <div id="inputArea" class="bg-[#202c33] p-2 hidden input-bar">
            <div class="flex gap-1 items-center">
              <button id="attachBtn" class="btn-icon text-lg px-1">📎</button>
              <button id="stickerBtn" class="btn-icon text-lg px-1">😊</button>
              <input id="msgInput" type="text" placeholder="Хабар..."
                class="flex-1 bg-[#2a3942] p-2 rounded outline-none text-sm">
              <button id="micBtn" class="btn-icon text-lg px-1">🎤</button>
              <button id="sendBtn" class="bg-[#00a884] px-3 py-2 rounded text-xs">Юбор</button>
            </div>
            <input type="file" id="fileInput" accept="image/*,audio/*" class="hidden">
          </div>
        </div>
      </div>
    `;
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('stickerBtn').onclick = toggleStickers;
    document.getElementById('micBtn').onclick = toggleRecording;
    document.getElementById('fileInput').onchange = uploadFile;
    document.getElementById('menuBtn').onclick = toggleSidebar;
    document.getElementById('overlay').onclick = toggleSidebar;
    loadStickers();
    loadUsers();
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }

  function loadStickers() {
    const panel = document.getElementById('stickerPanel');
    panel.innerHTML = STICKERS.map(s =>
      `<div class="text-2xl cursor-pointer hover:bg-[#2a3942] rounded p-1 text-center" onclick="sendSticker('${s}')">${s}</div>`
    ).join('');
  }

  function toggleStickers() {
    document.getElementById('stickerPanel').classList.toggle('hidden');
  }

  window.sendSticker = async (sticker) => {
    if (!currentChatId) return;
    toggleStickers();
    await push(ref(db, `chats/${currentChatId}`), {
      text: sticker, sender: currentUser.uid, time: serverTimestamp(), type: 'sticker'
    });
  }

  function loadUsers() {
    const usersRef = ref(db, 'users');
    onValue(usersRef, snap => {
      const users = snap.val() || {};
      const list = document.getElementById('usersList');
      list.innerHTML = '';

      const uniqueUsers = {};
      Object.entries(users).forEach(([uid, user]) => {
        if (uid === currentUser.uid) return;
        if (!uniqueUsers[user.name] || user.lastSeen > uniqueUsers[user.name].lastSeen) {
          uniqueUsers[user.name] = {...user, uid};
        }
      });

      Object.values(uniqueUsers).forEach(user => {
        const div = document.createElement('div');
        div.className = 'p-3 border-b border-gray-700 hover:bg-[#202c33] cursor-pointer flex items-center gap-3';
        div.innerHTML = `
          <div class="w-2.5 h-2.5 rounded-full ${user.online? 'bg-green-500' : 'bg-gray-500'}"></div>
          <div>
            <div class="font-bold text-sm">${user.name}</div>
            <div class="text-xs text-gray-400">${user.online? 'онлайн' : 'оффлайн'}</div>
          </div>
        `;
        div.onclick = () => {
          openChat(user.uid, user.name);
          if (window.innerWidth < 768) toggleSidebar();
        };
        list.appendChild(div);
      });
    });
  }

  function openChat(otherUid, otherName) {
    currentChatId = [currentUser.uid, otherUid].sort().join('_');
    document.getElementById('chatHeaderText').textContent = otherName;
    document.getElementById('inputArea').classList.remove('hidden');
    document.getElementById('sendBtn').onclick = sendMsg;
    document.getElementById('msgInput').onkeyup = e => e.key === 'Enter' && sendMsg();
    loadMessages();
    listenNotifications(otherUid);
  }

  function listenNotifications(otherUid) {
    const msgsRef = ref(db, `chats/${currentChatId}`);
    onChildAdded(msgsRef, snap => {
      const msg = snap.val();
      if (msg.sender!== currentUser.uid && document.hidden && notificationEnabled) {
        new Notification('DOIRA - Янги хабар', {
          body: msg.type === 'text'? msg.text : msg.type === 'sticker'? msg.text : 'Файл юборилди',
          icon: 'https://i.ibb.co/1nkMHXz/chat-icon.png'
        });
      }
    });
  }

  function loadMessages() {
    if (messagesUnsubscribe) messagesUnsubscribe();
    const msgsRef = ref(db, `chats/${currentChatId}`);
    messagesUnsubscribe = onValue(msgsRef, snap => {
      const msgs = snap.val() || {};
      const box = document.getElementById('messages');
      box.innerHTML = '';
      Object.entries(msgs).forEach(([key, msg]) => {
        const div = document.createElement('div');
        const isMine = msg.sender === currentUser.uid;
        div.className = `mb-2 flex ${isMine? 'justify-end' : 'justify-start'} relative`;

        let content = '';
        if (msg.type === 'image') {
          content = `<img src="${msg.url}" class="msg-img rounded-lg cursor-pointer" onclick="viewImg('${msg.url}')">`;
        } else if (msg.type === 'audio') {
          content = `<audio controls src="${msg.url}" class="msg-audio"></audio>`;
        } else if (msg.type === 'sticker') {
          content = `<div class="text-5xl md:text-6xl">${msg.text || ''}</div>`;
        } else {
          content = msg.text || '';
        }

        div.innerHTML = `
          <div class="max-w-[75%] px-3 py-2 rounded-lg text-sm ${isMine? 'msg-out' : 'msg-in'} break-words msg-text"
               ${isMine? `oncontextmenu="showMsgMenu(event, '${key}'); return false;" ontouchstart="startTouch(event, '${key}')" ontouchend="endTouch()"` : ''}>
            ${content}
          </div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    });
  }

  let touchTimer = null;
  window.startTouch = (e, key) => {
    touchTimer = setTimeout(() => showMsgMenu(e, key), 600);
  }
  window.endTouch = () => clearTimeout(touchTimer);

  window.showMsgMenu = (e, key) => {
    e.preventDefault();
    document.querySelectorAll('.msg-menu').forEach(m => m.remove());
    const menu = document.createElement('div');
    menu.className = 'msg-menu';
    menu.innerHTML = `<button onclick="deleteMsg('${key}')" class="block px-4 py-2 hover:bg-[#2a3942] rounded text-sm">Ўчириш</button>`;
    menu.style.left = e.pageX + 'px';
    menu.style.top = e.pageY + 'px';
    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 0);
  }

  window.deleteMsg = async (key) => {
    await remove(ref(db, `chats/${currentChatId}/${key}`));
  }

  window.viewImg = (url) => {
    currentViewerUrl = url;
    document.getElementById('viewerImg').src = url;
    document.getElementById('imgViewer').classList.remove('hidden');
  }

  window.closeImgViewer = () => {
    document.getElementById('imgViewer').classList.add('hidden');
  }

  window.downloadImg = () => {
    const a = document.createElement('a');
    a.href = currentViewerUrl;
    a.download = 'doira-image.jpg';
    a.target = '_blank';
    a.click();
  }

  async function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text ||!currentChatId) return;
    input.value = '';
    await push(ref(db, `chats/${currentChatId}`), {
      text, sender: currentUser.uid, time: serverTimestamp(), type: 'text'
    });
  }

  async function uploadFile(e) {
    const file = e.target.files[0];
    if (!file ||!currentChatId) return;

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.textContent = '...';
    sendBtn.disabled = true;

    try {
      let url, type;

      if (file.type.startsWith('image')) {
        const formData = new FormData();
        formData.append('image', file);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error?.message);
        url = data.data.url;
        type = 'image';
      } else if (file.type.startsWith('audio')) {
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', file);
        const res = await fetch(CATBOX_URL, { method: 'POST', body: formData });
        url = await res.text();
        if (!url.startsWith('http')) throw new Error('Юкланмади');
        type = 'audio';
      } else {
        throw new Error('Фақат расм ёки овоз');
      }

      await push(ref(db, `chats/${currentChatId}`), {
        url, sender: currentUser.uid, time: serverTimestamp(), type
      });

    } catch (err) {
      alert('Хато: ' + err.message);
    }

    sendBtn.textContent = 'Юбор';
    sendBtn.disabled = false;
    e.target.value = '';
  }

  async function toggleRecording() {
    const micBtn = document.getElementById('micBtn');

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤';
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const file = new File([blob], 'voice.webm', { type: 'audio/webm' });

        micBtn.textContent = '⏳';
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', file);

        try {
          const res = await fetch(CATBOX_URL, { method: 'POST', body: formData });
          const url = await res.text();
          if (url.startsWith('http')) {
            await push(ref(db, `chats/${currentChatId}`), {
              url, sender: currentUser.uid, time: serverTimestamp(), type: 'audio'
            });
          } else {
            alert('Овоз юборилмади');
          }
        } catch (err) {
          alert('Овоз юборилмади: ' + err.message);
        }
        micBtn.textContent = '🎤';
        stream.getTracks().forEach(t => t.stop());
      };

      mediaRecorder.start();
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹️';

    } catch (err) {
      alert('Микрофон рухсати керак');
    }
  }

  async function logout() {
    await remove(ref(db, `users/${currentUser.uid}`));
    localStorage.removeItem('doira_name');
    location.reload();
  }

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      const name = localStorage.getItem('doira_name');
      if (!name) return showLogin();

      const userRef = ref(db, `users/${user.uid}`);
      await set(userRef, { name, online: true, lastSeen: serverTimestamp() });
      onDisconnect(userRef).update({ online: false, lastSeen: serverTimestamp() });
      showChat();
    } else {
      showLogin();
    }
  });
</script>

</body>
</html>
