<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doira Private</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  .chat-bg { background: #0e1621; }
  .msg-out { background: #2b5278; }
  .msg-in { background: #182533; }
  .sidebar { transition: transform 0.3s; }
    @media (max-width: 768px) {
    .sidebar { position: absolute; z-index: 50; height: 100%; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .chat-area { width: 100%; }
    }
  .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sticker { font-size: 40px; cursor: pointer; text-align: center; padding: 5px; }
  .sticker:hover { background: #1e2936; border-radius: 8px; }
  </style>
</head>
<body class="chat-bg text-white">

<div id="app"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getDatabase, ref, set, onValue, push, onDisconnect, serverTimestamp, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAksQf3rkeG998TmJj-YuA3WpTDLLZ1ais",
    authDomain: "doira-chat-v2.firebaseapp.com",
    databaseURL: "https://doira-chat-v2-default-rtdb.firebaseio.com",
    projectId: "doira-chat-v2",
    storageBucket: "doira-chat-v2.firebasestorage.app",
    messagingSenderId: "885552294238",
    appId: "1:885552294238:web:8a5d288d1eb57e11b687cf"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentChatId = null;
  let messagesUnsubscribe = null;
  let mediaRecorder = null;
  let audioChunks = [];

  const appDiv = document.getElementById('app');
  const stickers = ['😀','😂','😍','😘','😎','😭','😡','👍','👎','🔥','❤️','💯','🎉','🤔','🙏','👏','😴','🤮','💩','👻','💀','🤡','👽','🤖'];

  function showLogin() {
    appDiv.innerHTML = `
      <div class="flex items-center justify-center h-screen p-4">
        <div class="bg-[#17212b] p-8 rounded-2xl w-full max-w-sm">
          <h1 class="text-3xl font-bold text-center mb-6">DOIRA</h1>
          <input id="nameInput" type="text" placeholder="Исмингизни киритинг"
            class="w-full bg-[#232e3c] p-3 rounded-lg mb-4 outline-none text-white">
          <button id="joinBtn" class="w-full bg-[#5288c1] p-3 rounded-lg font-bold active:scale-95">Кириш</button>
        </div>
      </div>
    `;
    document.getElementById('joinBtn').onclick = join;
    document.getElementById('nameInput').onkeyup = e => e.key === 'Enter' && join();
  }

  async function join() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    localStorage.setItem('doira_name', name);
    await signInAnonymously(auth);
  }

  function showChat() {
    appDiv.innerHTML = `
      <div class="flex h-screen w-screen">
        <div id="sidebar" class="sidebar w-full md:w-80 bg-[#17212b] border-r border-gray-800 flex flex-col">
          <div class="bg-[#17212b] p-3 flex justify-between items-center border-b border-gray-800">
            <button id="menuBtn" class="md:hidden text-2xl">☰</button>
            <h1 class="text-lg font-bold">DOIRA Чат</h1>
            <button id="logoutBtn" class="bg-red-600 px-3 py-1.5 rounded-lg text-sm active:scale-95">Чиқиш</button>
          </div>
          <div id="usersList" class="overflow-y-auto flex-1"></div>
        </div>

        <div class="chat-area flex-1 flex flex-col bg-[#0e1621]">
          <div id="chatHeader" class="bg-[#17212b] p-3 flex items-center gap-3 border-b border-gray-800">
            <button id="backBtn" class="md:hidden text-2xl">←</button>
            <div id="chatName" class="font-bold">Суҳбатдошни танланг</div>
          </div>

          <div id="messages" class="flex-1 overflow-y-auto p-3 space-y-2"></div>

          <div id="stickerPanel" class="hidden bg-[#17212b] p-3 border-t border-gray-800">
            <div class="sticker-grid">${stickers.map(s => `<div class="sticker" onclick="sendSticker('${s}')">${s}</div>`).join('')}</div>
          </div>

          <div id="inputArea" class="bg-[#17212b] p-2 hidden">
            <div class="flex gap-2 items-center">
              <button id="stickerBtn" class="text-2xl px-1">😀</button>
              <button id="attachBtn" class="text-2xl px-1">📎</button>
              <input id="msgInput" type="text" placeholder="Хабар..."
                class="flex-1 bg-[#232e3c] px-4 py-2.5 rounded-full outline-none text-sm">
              <button id="micBtn" class="text-2xl px-1">🎤</button>
              <button id="sendBtn" class="bg-[#5288c1] w-10 h-10 rounded-full flex items-center justify-center active:scale-95">➤</button>
            </div>
            <input type="file" id="fileInput" accept="image/*,audio/*,video/*" class="hidden">
          </div>
        </div>
      </div>
    `;

    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = uploadFile;
    document.getElementById('stickerBtn').onclick = toggleStickers;
    document.getElementById('micBtn').onclick = toggleRecording;
    document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.add('open');
    document.getElementById('backBtn').onclick = () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('inputArea').classList.add('hidden');
      document.getElementById('chatName').textContent = 'Суҳбатдошни танланг';
    };
    loadUsers();
  }

  window.sendSticker = async (sticker) => {
    if (!currentChatId) return;
    await push(ref(db, `chats/${currentChatId}`), {
      text: sticker, sender: currentUser.uid, time: serverTimestamp(), type: 'sticker'
    });
    toggleStickers();
  }

  function toggleStickers() {
    document.getElementById('stickerPanel').classList.toggle('hidden');
  }

  function loadUsers() {
    const usersRef = ref(db, 'users');
    onValue(usersRef, snap => {
      const users = snap.val() || {};
      const list = document.getElementById('usersList');
      list.innerHTML = '';

      const uniqueUsers = {};
      Object.entries(users).forEach(([uid, user]) => {
        if (uid === currentUser.uid) return;
        if (!uniqueUsers[user.name] || user.lastSeen > uniqueUsers[user.name].lastSeen) {
          uniqueUsers[user.name] = {...user, uid};
        }
      });

      Object.values(uniqueUsers).forEach(user => {
        const div = document.createElement('div');
        div.className = 'p-3 border-b border-gray-800 hover:bg-[#232e3c] cursor-pointer flex items-center gap-3 active:bg-[#2b3d4f]';
        div.innerHTML = `
          <div class="w-12 h-12 rounded-full bg-[#5288c1] flex items-center justify-center text-xl font-bold">${user.name[0]}</div>
          <div class="flex-1">
            <div class="font-bold">${user.name}</div>
            <div class="text-xs text-gray-400">${user.online? 'онлайн' : 'оффлайн'}</div>
          </div>
        `;
        div.onclick = () => {
          openChat(user.uid, user.name);
          if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
        };
        list.appendChild(div);
      });
    });
  }

  function openChat(otherUid, otherName) {
    currentChatId = [currentUser.uid, otherUid].sort().join('_');
    document.getElementById('chatName').textContent = otherName;
    document.getElementById('inputArea').classList.remove('hidden');
    document.getElementById('sendBtn').onclick = sendMsg;
    document.getElementById('msgInput').onkeyup = e => e.key === 'Enter' && sendMsg();
    loadMessages();
  }

  function loadMessages() {
    if (messagesUnsubscribe) messagesUnsubscribe();
    const msgsRef = ref(db, `chats/${currentChatId}`);
    messagesUnsubscribe = onValue(msgsRef, snap => {
      const msgs = snap.val() || {};
      const box = document.getElementById('messages');
      box.innerHTML = '';
      Object.values(msgs).forEach(msg => {
        const div = document.createElement('div');
        const isMine = msg.sender === currentUser.uid;
        div.className = `flex ${isMine? 'justify-end' : 'justify-start'}`;

        let content = '';
        if (msg.type === 'image') {
          content = `<img src="${msg.url}" class="max-w-[70vw] md:max-w-xs rounded-lg">`;
        } else if (msg.type === 'audio') {
          content = `<audio controls src="${msg.url}" class="max-w-[70vw]"></audio>`;
        } else if (msg.type === 'sticker') {
          content = `<div class="text-6xl">${msg.text}</div>`;
        } else {
          content = `<div class="break-words">${msg.text}</div>`;
        }

        div.innerHTML = `
          <div class="max-w-[80%] px-3 py-2 rounded-2xl ${isMine? 'msg-out rounded-br-sm' : 'msg-in rounded-bl-sm'}">
            ${content}
          </div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    });
  }

  async function sendMsg() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text ||!currentChatId) return;
    input.value = '';
    await push(ref(db, `chats/${currentChatId}`), {
      text, sender: currentUser.uid, time: serverTimestamp(), type: 'text'
    });
  }

  async function uploadFile(e) {
    const file = e.target.files[0];
    if (!file ||!currentChatId) return;

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.innerHTML = '⏳';

    const formData = new FormData();
    formData.append('reqtype', 'fileupload');
    formData.append('fileToUpload', file);

    try {
      const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: formData });
      const url = await res.text();

      if (url.startsWith('https://')) {
        const type = file.type.startsWith('image')? 'image' : 'audio';
        await push(ref(db, `chats/${currentChatId}`), {
          url, sender: currentUser.uid, time: serverTimestamp(), type
        });
      } else {
        alert('Юклашда хато');
      }
    } catch (err) {
      alert('Хато: ' + err.message);
    }

    sendBtn.innerHTML = '➤';
    e.target.value = '';
  }

  async function toggleRecording() {
    const micBtn = document.getElementById('micBtn');

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      micBtn.textContent = '🎤';
      micBtn.classList.remove('text-red-500');
    } else {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const file = new File([audioBlob], 'voice.webm', { type: 'audio/webm' });

          const formData = new FormData();
          formData.append('reqtype', 'fileupload');
          formData.append('fileToUpload', file);

          micBtn.textContent = '⏳';
          try {
            const res = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: formData });
            const url = await res.text();
            if (url.startsWith('https://')) {
              await push(ref(db, `chats/${currentChatId}`), {
                url, sender: currentUser.uid, time: serverTimestamp(), type: 'audio'
              });
            }
          } catch (err) { alert('Хато'); }
          micBtn.textContent = '🎤';
          stream.getTracks().forEach(t => t.stop());
        };

        mediaRecorder.start();
        micBtn.textContent = '⏹️';
        micBtn.classList.add('text-red-500');
      } catch (err) {
        alert('Микрофонга рухсат беринг');
      }
    }
  }

  async function logout() {
    await remove(ref(db, `users/${currentUser.uid}`));
    localStorage.removeItem('doira_name');
    location.reload();
  }

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      const name = localStorage.getItem('doira_name');
      if (!name) return showLogin();

      const userRef = ref(db, `users/${user.uid}`);
      await set(userRef, { name, online: true, lastSeen: serverTimestamp() });
      onDisconnect(userRef).update({ online: false, lastSeen: serverTimestamp() });
      showChat();
    } else {
      showLogin();
    }
  });
</script>

</body>
</html>
