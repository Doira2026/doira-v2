<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOIRA Чат - 1-1 ТЕСТ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #userList { height: calc(100vh - 60px); overflow-y: auto; }
    #messages { height: calc(100vh - 120px); overflow-y: auto; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">

  <!-- Исм сўраш ойнаси -->
  <div id="loginBox" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold mb-4">DOIRA Чатга кириш</h2>
      <input id="nameInput" type="text" placeholder="Исмингизни ёзинг..." class="border px-4 py-2 rounded w-64 mb-4">
      <button id="loginBtn" type="button" class="bg-blue-600 text-white px-6 py-2 rounded w-full">Кириш</button>
    </div>
  </div>

  <!-- ЧАП: Юзерлар -->
  <div class="w-1/3 bg-white border-r flex flex-col">
    <div class="bg-blue-600 text-white p-4 font-bold text-lg flex justify-between items-center">
      <span>DOIRA Чат</span>
      <button onclick="logout()" type="button" class="text-sm bg-red-500 px-3 py-1 rounded">Чиқиш</button>
    </div>
    <div id="userList"></div>
  </div>

  <!-- ЎНГ: Чат -->
  <div class="w-2/3 flex flex-col">
    <div id="chatHeader" class="bg-white p-4 border-b font-semibold">Суҳбатдош танланг</div>
    <div id="messages" class="flex-1 p-4 bg-gray-50"></div>
    <div class="bg-white p-4 border-t flex gap-2">
      <input id="msgInput" type="text" placeholder="Хабар ёзинг..." class="flex-1 border rounded-lg px-4 py-2">
      <button onclick="sendMsg()" type="button" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Юбориш</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBneK7bIHL_eNezkLIDNe04xdQCeFLI3ok",
    authDomain: "doira-chat.firebaseapp.com",
    projectId: "doira-chat",
    storageBucket: "doira-chat.firebasestorage.app",
    messagingSenderId: "885582106800",
    appId: "1:885582106800:web:1569e109010bbf128f6b75"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentUser = null;
  let currentChatUser = null;
  let unsubscribeMessages = null;
  let unsubscribeUsers = null;

  // Кнопка ва Enter ишлаши учун
  document.getElementById('loginBtn').addEventListener('click', startChat);
  document.getElementById('nameInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') startChat();
  });
  document.getElementById('msgInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMsg();
  });

  // Аввалги сессияни текшир
  const savedName = localStorage.getItem('doira_name');
  if (savedName) {
    document.getElementById('nameInput').value = savedName;
    startChat();
  }

  async function startChat() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return alert('Исм ёзинг');
    
    const uid = name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
    currentUser = { uid: uid, name: name };
    
    await setDoc(doc(db, 'users', uid), { 
      uid: uid, 
      name: name, 
      online: true,
      lastSeen: serverTimestamp()
    });
    
    localStorage.setItem('doira_name', name);
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('chatHeader').innerText = "Хуш келибсан: " + name;
    loadUsers();
  }

  function loadUsers() {
    if (unsubscribeUsers) unsubscribeUsers();
    const usersRef = collection(db, 'users');
    
    unsubscribeUsers = onSnapshot(usersRef, (snapshot) => {
      const list = document.getElementById('userList');
      list.innerHTML = '';
      snapshot.forEach(doc => {
        const u = doc.data();
        if (!u.name || u.uid === currentUser.uid) return;
        list.innerHTML += `
          <div onclick="window.openChat('${u.uid}', '${u.name}')" class="p-4 hover:bg-gray-100 cursor-pointer border-b">
            <div class="font-semibold">${u.name}</div>
            <div class="text-sm text-green-500">🟢 Онлайн</div>
          </div>
        `;
      });
      if(list.innerHTML === '') list.innerHTML = '<div class="p-4 text-gray-400 text-center">Ҳозирча ҳеч ким йўқ</div>';
    });
  }

  window.openChat = (uid, name) => {
    currentChatUser = uid;
    document.getElementById('chatHeader').innerText = name;
    loadMessages(uid);
  }

  function loadMessages(otherUid) {
    if (unsubscribeMessages) unsubscribeMessages();
    const chatId = [currentUser.uid, otherUid].sort().join('_');
    const q = query(collection(db, 'private_messages', chatId, 'messages'), orderBy('time'));
    
    unsubscribeMessages = onSnapshot(q, (snapshot) => {
      const msgBox = document.getElementById('messages');
      msgBox.innerHTML = '';
      snapshot.forEach(doc => {
        const m = doc.data();
        const isMe = m.from === currentUser.uid;
        msgBox.innerHTML += `
          <div class="mb-2 flex ${isMe ? 'justify-end' : 'justify-start'}">
            <span class="px-4 py-2 rounded-lg max-w-xs ${isMe ? 'bg-blue-600 text-white' : 'bg-gray-200'}">${m.text}</span>
          </div>
        `;
      });
      msgBox.scrollTop = msgBox.scrollHeight;
    });
  }

  window.sendMsg = async () => {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !currentChatUser) return alert('Аввал чапдан суҳбатдош танланг');
    
    const chatId = [currentUser.uid, currentChatUser].sort().join('_');
    await addDoc(collection(db, 'private_messages', chatId, 'messages'), {
      from: currentUser.uid,
      fromName: currentUser.name,
      text: text,
      time: serverTimestamp()
    });
    input.value = '';
  }

  window.logout = async () => {
    if (currentUser) {
      await deleteDoc(doc(db, 'users', currentUser.uid));
      localStorage.removeItem('doira_name');
      location.reload();
    }
  }
</script>
</body>
</html>
