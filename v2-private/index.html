<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOIRA 1-1 Чат</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="flex h-screen">
    <!-- Чап: Юзерлар рўйхати -->
    <div class="w-1/3 bg-white border-r overflow-y-auto">
      <div class="p-4 border-b bg-blue-600 text-white font-bold text-lg">
        DOIRA Чат
      </div>
      <div id="userList" class="divide-y">
        <!-- Юзерлар шу ерга тушади -->
      </div>
    </div>

    <!-- Ўнг: Чат ойнаси -->
    <div class="flex-1 flex flex-col">
      <div id="chatHeader" class="p-4 bg-white border-b font-bold">
        Суҳбатдош танланг
      </div>
      <div id="messages" class="flex-1 p-4 overflow-y-auto bg-gray-50">
        <p class="text-gray-400 text-center mt-20">Чапдан одам танланг</p>
      </div>
      <div class="p-4 bg-white border-t flex gap-2">
        <input id="msgInput" type="text" placeholder="Хабар ёзинг..." class="flex-1 border rounded-lg px-3 py-2">
        <button onclick="sendMsg()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Юбориш</button>
      </div>
    </div>
  </div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // БУ ЖОЙНИ КЕЙИН ТЎЛДИРАМИЗ
 const firebaseConfig = {
  apiKey: "AIzaSyDbsDFe8L_v-H_dKCv5m3rYmUOnymKj114",
  authDomain: "doira-chat-2026.firebaseapp.com",
  databaseURL: "https://doira-chat-2026-default-rtdb.firebaseio.com",
  projectId: "doira-chat-2026",
  storageBucket: "doira-chat-2026.firebasestorage.app",
  messagingSenderId: "24569627793",
  appId: "1:24569627793:web:b1a8acb36d17adc180ab30"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let currentUser = null;
  let currentChat = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadUsers();
    } else {
      window.location.href = "/doira-v2/";
    }
  });

  function loadUsers() {
    const usersRef = ref(db, 'users');
    onValue(usersRef, (snapshot) => {
      const users = snapshot.val();
      const list = document.getElementById('userList');
      list.innerHTML = '';
      for (let uid in users) {
        if (uid === currentUser.uid) continue;
        const u = users[uid];
        list.innerHTML += `
          <div onclick="window.openChat('${uid}', '${u.name}')" class="p-4 hover:bg-gray-100 cursor-pointer">
            <div class="font-semibold">${u.name}</div>
            <div class="text-sm text-gray-500">${u.online? 'Онлайн' : 'Оффлайн'}</div>
          </div>
        `;
      }
    });
  }

  window.openChat = function(userId, name) {
    currentChat = userId;
    document.getElementById('chatHeader').innerText = name;
    document.getElementById('messages').innerHTML = 'Юкланмоқда...';
    const chatId = [currentUser.uid, userId].sort().join('_');
    const msgRef = ref(db, `private_chats/${chatId}`);
    onValue(msgRef, (snapshot) => {
      const messages = snapshot.val();
      const msgBox = document.getElementById('messages');
      msgBox.innerHTML = '';
      for (let key in messages) {
        const msg = messages[key];
        const isMe = msg.from === currentUser.uid;
        msgBox.innerHTML += `
          <div class="mb-2 flex ${isMe? 'justify-end' : 'justify-start'}">
            <span class="${isMe? 'bg-blue-500 text-white' : 'bg-gray-200'} px-4 py-2 rounded-lg max-w-xs">${msg.text}</span>
          </div>`;
      }
      msgBox.scrollTop = msgBox.scrollHeight;
    });
  }

  window.sendMsg = function() {
    const input = document.getElementById('msgInput');
    if (!input.value.trim() ||!currentChat) return;
    const chatId = [currentUser.uid, currentChat].sort().join('_');
    const msgRef = ref(db, `private_chats/${chatId}`);
    push(msgRef, {
      from: currentUser.uid,
      text: input.value,
      time: Date.now()
    });
    input.value = '';
  }
</script>
</body>
</html>
