<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DoiraChat — Kirish</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DoiraChat">
<meta name="theme-color" content="#00a884">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b141a; --bg2:#111b21; --bg3:#1f2c34; --bg4:#2a3942;
  --accent:#00a884; --text:#e9edef; --text2:#8696a0;
  --border:#2a3942; --danger:#f15c6d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input{font-family:inherit;border:none;outline:none;background:none;color:var(--text)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.wrap{width:min(400px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px 32px;text-align:center;animation:slideUp .5s ease;position:relative}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.lang-switch{position:absolute;top:14px;right:14px;display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:3px}
.lang-btn{padding:5px 9px;border-radius:7px;font-size:12px;font-weight:700;color:var(--text2);transition:.15s}
.lang-btn.active{background:var(--accent);color:#fff}
.logo{font-size:52px;margin-bottom:12px;display:block}
.title{font-size:26px;font-weight:700;color:var(--accent);margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--bg3);border-radius:12px;padding:4px}
.tab{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:600;transition:.2s;color:var(--text2)}
.tab.active{background:var(--accent);color:#fff}
.field{width:100%;background:var(--bg3);border-radius:12px;padding:13px 16px;font-size:15px;color:var(--text);margin-bottom:10px;border:2px solid transparent;transition:.2s}
.field:focus{border-color:var(--accent);background:var(--bg4)}
.field::placeholder{color:var(--text2)}
.err{font-size:12px;color:var(--danger);margin-bottom:8px;min-height:16px;text-align:left}
.btn{width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:700;transition:.2s;margin-top:4px}
.btn:active{transform:scale(0.98);opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:11px;color:var(--text2);margin-top:14px;line-height:1.6}
.pass-wrap{position:relative}
.pass-wrap .field{padding-right:44px}
.eye-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text2);border-radius:8px}
.eye-btn:active{background:var(--bg4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-switch">
    <button class="lang-btn" id="langUzBtn" onclick="setLoginLang('uz')">UZ</button>
    <button class="lang-btn" id="langRuBtn" onclick="setLoginLang('ru')">RU</button>
    <button class="lang-btn" id="langEnBtn" onclick="setLoginLang('en')">EN</button>
  </div>
  <span class="logo">💬</span>
  <div class="title">DoiraChat</div>
  <div class="sub" id="subText">Hisobingizga kiring</div>
  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Kirish</button>
    <button class="tab" id="tabReg" onclick="switchTab('reg')">Ro'yxat</button>
  </div>
  <input id="nameInput" class="field" type="text" placeholder="Ismingiz" style="display:none" autocomplete="name">
  <input id="emailInput" class="field" type="email" placeholder="Email manzilingiz" autocomplete="email">
  <div class="pass-wrap">
    <input id="passInput" class="field" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="current-password">
    <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePassVisibility()" tabindex="-1">
      <svg id="eyeIconOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg id="eyeIconClosed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 0 1-4.24-4.24"/><path d="M6.61 6.61A18.5 18.5 0 0 0 1 13s4 8 11 8a10.4 10.4 0 0 0 5.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
  </div>
  <div class="err" id="errMsg"></div>
  <button class="btn" id="authBtn" onclick="doAuth()">Kirish</button>
  <div class="note" id="noteText">📧 Gmail, Mail.ru yoki istalgan email bilan kiring.</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, setPersistence, browserLocalPersistence, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, set, update, serverTimestamp, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const app = initializeApp({
  apiKey: "AIzaSyAksQf3rkeG998TmJj-YuA3WpTDLLZ1ais",
  authDomain: "doira-chat-v2.firebaseapp.com",
  databaseURL: "https://doira-chat-v2-default-rtdb.firebaseio.com",
  projectId: "doira-chat-v2",
  storageBucket: "doira-chat-v2.firebasestorage.app",
  messagingSenderId: "885552294238",
  appId: "1:885552294238:web:8a5d288d1eb57e11b687cf"
});
const auth = getAuth(app);
const db = getDatabase(app);

// === TIL (Til/Язык/Language) ===
const LOGIN_LANGS = {
  uz: {
    subLogin: "Hisobingizga kiring", subReg: "Yangi hisob yarating",
    tabLogin: "Kirish", tabReg: "Ro'yxat",
    nameP: "Ismingiz", emailP: "Email manzilingiz", passP: "Parol (kamida 6 belgi)",
    btnLogin: "Kirish", btnReg: "Ro'yxatdan o'tish",
    noteLogin: "📧 Email va parol bilan kiring.",
    noteReg: "✅ Bir marta ro'yxatdan o'ting — keyingi safar email+parol bilan kirasiz.",
    errEmail: "❌ Email kiriting", errPass: "❌ Parol kamida 6 belgi", errName: "❌ Ismingizni kiriting",
    errInUse: "❌ Bu email ro'yxatdan o'tgan. Kirish tabiga o'ting.",
    errNotFound: "❌ Bu email topilmadi. Ro'yxatdan o'ting.",
    errWrongPass: "❌ Parol noto'g'ri.", errInvalidCred: "❌ Email yoki parol noto'g'ri.",
    errInvalidEmail: "❌ Email noto'g'ri formatda.", errTooMany: "❌ Juda ko'p urinish. Biroz kuting.",
    errNetwork: "❌ Internet aloqasi yo'q.",
  },
  ru: {
    subLogin: "Войдите в аккаунт", subReg: "Создайте новый аккаунт",
    tabLogin: "Войти", tabReg: "Регистрация",
    nameP: "Ваше имя", emailP: "Ваш email", passP: "Пароль (минимум 6 символов)",
    btnLogin: "Войти", btnReg: "Зарегистрироваться",
    noteLogin: "📧 Войдите с email и паролем.",
    noteReg: "✅ Зарегистрируйтесь один раз — в следующий раз входите по email+паролю.",
    errEmail: "❌ Введите email", errPass: "❌ Пароль минимум 6 символов", errName: "❌ Введите имя",
    errInUse: "❌ Этот email уже зарегистрирован. Перейдите на вкладку «Войти».",
    errNotFound: "❌ Email не найден. Зарегистрируйтесь.",
    errWrongPass: "❌ Неверный пароль.", errInvalidCred: "❌ Неверный email или пароль.",
    errInvalidEmail: "❌ Неверный формат email.", errTooMany: "❌ Слишком много попыток. Подождите.",
    errNetwork: "❌ Нет подключения к интернету.",
  },
  en: {
    subLogin: "Sign in to your account", subReg: "Create a new account",
    tabLogin: "Sign in", tabReg: "Register",
    nameP: "Your name", emailP: "Your email address", passP: "Password (min 6 characters)",
    btnLogin: "Sign in", btnReg: "Register",
    noteLogin: "📧 Sign in with your email and password.",
    noteReg: "✅ Register once — next time sign in with email+password.",
    errEmail: "❌ Enter your email", errPass: "❌ Password must be at least 6 characters", errName: "❌ Enter your name",
    errInUse: "❌ This email is already registered. Go to the Sign in tab.",
    errNotFound: "❌ Email not found. Please register.",
    errWrongPass: "❌ Incorrect password.", errInvalidCred: "❌ Incorrect email or password.",
    errInvalidEmail: "❌ Invalid email format.", errTooMany: "❌ Too many attempts. Please wait.",
    errNetwork: "❌ No internet connection.",
  }
};
let loginLang = localStorage.getItem('dc_lang') || 'uz';
const lt = k => LOGIN_LANGS[loginLang][k] || LOGIN_LANGS.uz[k] || k;

window.setLoginLang = function(l) {
  loginLang = l;
  localStorage.setItem('dc_lang', l);
  document.getElementById('langUzBtn').className = 'lang-btn' + (l==='uz'?' active':'');
  document.getElementById('langRuBtn').className = 'lang-btn' + (l==='ru'?' active':'');
  document.getElementById('langEnBtn').className = 'lang-btn' + (l==='en'?' active':'');
  applyLoginLang();
};

function applyLoginLang() {
  document.getElementById('nameInput').placeholder = lt('nameP');
  document.getElementById('emailInput').placeholder = lt('emailP');
  document.getElementById('passInput').placeholder = lt('passP');
  document.getElementById('tabLogin').textContent = lt('tabLogin');
  document.getElementById('tabReg').textContent = lt('tabReg');
  document.getElementById('subText').textContent = currentTab==='login' ? lt('subLogin') : lt('subReg');
  document.getElementById('authBtn').textContent = currentTab==='login' ? lt('btnLogin') : lt('btnReg');
  document.getElementById('noteText').textContent = currentTab==='login' ? lt('noteLogin') : lt('noteReg');
}

// Persistence - brauzer sessionni eslab qoladi
setPersistence(auth, browserLocalPersistence).catch(()=>{});

// Agar allaqachon kirgan bo'lsa - to'g'ridan chatga o'tish
onAuthStateChanged(auth, user => {
  if(user) window.location.replace('index.html');
});

let currentTab = 'login';

window.switchTab = function(tab) {
  currentTab = tab;
  document.getElementById('tabLogin').className = 'tab' + (tab==='login'?' active':'');
  document.getElementById('tabReg').className = 'tab' + (tab==='reg'?' active':'');
  document.getElementById('nameInput').style.display = tab==='reg'?'block':'none';
  document.getElementById('errMsg').textContent = '';
  applyLoginLang();
};

window.doAuth = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  const errEl = document.getElementById('errMsg');
  const btn = document.getElementById('authBtn');

  errEl.textContent = '';
  if (!email || !email.includes('@')) { errEl.textContent = lt('errEmail'); return; }
  if (!pass || pass.length < 6) { errEl.textContent = lt('errPass'); return; }
  if (currentTab==='reg' && !name) { errEl.textContent = lt('errName'); return; }

  btn.disabled = true;
  btn.textContent = '...';

  try {
    let userCred;
    if (currentTab === 'reg') {
      userCred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(userCred.user, { displayName: name });
      await set(ref(db, `users/${userCred.user.uid}`), {
        name: name, email: email, phone: '',
        online: true, lastSeen: serverTimestamp(), createdAt: serverTimestamp()
      });
    } else {
      userCred = await signInWithEmailAndPassword(auth, email, pass);
      await update(ref(db, `users/${userCred.user.uid}`), { online: true, lastSeen: serverTimestamp() });
    }

    const uid = userCred.user.uid;
    const displayName = userCred.user.displayName || name || email.split('@')[0];

    onDisconnect(ref(db, `users/${uid}`)).update({ online: false, lastSeen: serverTimestamp() });
    localStorage.setItem('dc_uid', uid);
    localStorage.setItem('dc_name', displayName);
    localStorage.setItem('dc_email', email);

    // Chatga o'tish
    window.location.replace('index.html');

  } catch(e) {
    btn.disabled = false;
    btn.textContent = currentTab==='login' ? lt('btnLogin') : lt('btnReg');
    const codes = {
      'auth/email-already-in-use': lt('errInUse'),
      'auth/user-not-found': lt('errNotFound'),
      'auth/wrong-password': lt('errWrongPass'),
      'auth/invalid-credential': lt('errInvalidCred'),
      'auth/invalid-email': lt('errInvalidEmail'),
      'auth/too-many-requests': lt('errTooMany'),
      'auth/network-request-failed': lt('errNetwork'),
    };
    errEl.textContent = codes[e.code] || ('❌ ' + e.message);
  }
};

window.togglePassVisibility = function() {
  const input = document.getElementById('passInput');
  const openIcon = document.getElementById('eyeIconOpen');
  const closedIcon = document.getElementById('eyeIconClosed');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  openIcon.style.display = isHidden ? 'none' : 'block';
  closedIcon.style.display = isHidden ? 'block' : 'none';
};

// Boshlang'ich tilni qo'llash
setLoginLang(loginLang);

document.addEventListener('keydown', e => { if(e.key==='Enter') window.doAuth(); });
</script>
</body>
</html>
