<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DOIRA Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --msg-bg: white;
            --text-color: #334155;
            --input-bg: #f8fafc;
            --border: #e2e8f0;
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --msg-bg: #334155;
            --text-color: #e2e8f0;
            --input-bg: #1e293b;
            --border: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 10px;
            transition: all 0.3s;
            overflow: hidden;
        }
        #login, #chat {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chat {
            display: none;
            flex-direction: column;
            height: 98vh;
            height: 98dvh;
            max-width: 700px;
            padding: 15px;
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 600;
        }
      .subtitle {
            text-align: center;
            margin-bottom: 12px;
            color: #64748b;
            font-size: 13px;
        }
      .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
            flex-shrink: 0;
        }
      .header-controls {
            display: flex;
            gap: 6px;
        }
        #themeBtn, #logoutBtn, #searchBtn, #roomsBtn {
            width: auto;
            padding: 7px 10px;
            font-size: 12px;
        }
        #themeBtn { background: #475569; }
        #logoutBtn { background: #ef4444; }
        #searchBtn { background: #10b981; }
        #roomsBtn { background: #3b82f6; }

        #onlineList {
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 6px 10px;
            margin-bottom: 8px;
            font-size: 11px;
            color: #10b981;
            max-height: 45px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #searchBox {
            display: none;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        #searchInput { margin: 0; }

        #roomsPanel {
            display: none;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
      .room-btn {
            width: auto;
            padding: 6px 10px;
            font-size: 12px;
            margin: 3px;
            background: #64748b;
        }
      .room-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
      .room-btn.locked::after {
            content: ' 🔒';
        }

        input {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 10px;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            color: var(--text-color);
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 6px;
            background: var(--input-bg);
            border-radius: 16px;
            -webkit-overflow-scrolling: touch;
        }
        #messages::-webkit-scrollbar { width: 5px; }
        #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        #typingIndicator {
            height: 16px;
            font-size: 11px;
            color: #94a3b8;
            font-style: italic;
            padding: 0 5px;
            flex-shrink: 0;
        }

      .message {
            padding: 9px 12px;
            margin-bottom: 8px;
            background: var(--msg-bg);
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            animation: msgIn 0.3s ease;
            word-wrap: break-word;
            position: relative;
        }
      .message.highlight {
            background: #fef3c7;
            border: 2px solid #f59e0b;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
      .msg-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
      .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            margin-right: 7px;
        }
      .user-name { color: #667eea; font-weight: 600; font-size: 12px; cursor: pointer; }
      .user-name:hover { text-decoration: underline; }
      .time { color: #94a3b8; font-size: 9px; margin-left: auto; }
      .msg-actions {
            display: flex;
            gap: 5px;
            margin-left: 6px;
        }
      .msg-btn {
            width: auto;
            padding: 2px 6px;
            font-size: 10px;
            background: #64748b;
        }
      .reply-preview {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            padding: 5px 8px;
            margin-bottom: 5px;
            margin-left: 35px;
            border-radius: 8px;
            font-size: 11px;
            color: #64748b;
        }
      .msg-text {
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.4;
            margin-left: 35px;
        }
      .msg-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-left: 35px;
            margin-top: 5px;
            cursor: pointer;
        }
      .msg-audio {
            margin-left: 35px;
            margin-top: 5px;
            width: calc(100% - 35px);
        }
      .reactions {
            display: flex;
            gap: 5px;
            margin-left: 35px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
      .reaction-btn {
            width: auto;
            padding: 3px 7px;
            font-size: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
        }
      .reaction-btn.active {
            background: #667eea;
            color: white;
        }

        #inputArea {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
            padding-top: 5px;
        }
        #msgInput { flex: 1; margin: 0; font-size: 16px; }
      .icon-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            font-size: 17px;
        }
        #sendBtn { width: 70px; margin: 0; padding: 11px; }
        #fileInput { display: none; }

        #stickerPanel {
            display: none;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 6px;
            max-height: 130px;
            overflow-y: auto;
            flex-shrink: 0;
        }
      .sticker {
            font-size: 30px;
            cursor: pointer;
            padding: 4px;
            display: inline-block;
            transition: transform 0.2s;
        }
      .sticker:hover { transform: scale(1.2); }

        #replyingTo {
            display: none;
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 8px;
            font-size: 11px;
            color: #64748b;
            flex-shrink: 0;
        }
        #cancelReply {
            float: right;
            cursor: pointer;
            color: #ef4444;
        }

        #encryptedBadge {
            display: none;
            background: #10b981;
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            margin-bottom: 6px;
            text-align: center;
            flex-shrink: 0;
        }

      .recording {
            background: #ef4444!important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div id="login">
        <h1>DOIRA</h1>
        <p class="subtitle">Жамоавий чатга хуш келибсиз 🚀</p>
        <input type="text" id="nameInput" placeholder="Исмингизни ёзинг" autocomplete="off">
        <button id="joinBtn">Чатга кириш</button>
    </div>

    <div id="chat">
        <div class="header-bar">
            <h1>DOIRA Чат</h1>
            <div class="header-controls">
                <button id="roomsBtn">💬</button>
                <button id="searchBtn">🔍</button>
                <button id="themeBtn">🌙</button>
                <button id="logoutBtn">Чиқиш</button>
            </div>
        </div>
        <div id="encryptedBadge">🔒 Махфий чат - шифрланган</div>
        <div id="onlineList">🟢 Онлайн: </div>

        <div id="searchBox">
            <input type="text" id="searchInput" placeholder="Хабарлардан қидириш...">
        </div>

        <div id="roomsPanel">
            <button class="room-btn active" data-room="general"># Умумий</button>
            <button class="room-btn" data-room="random"># Суҳбат</button>
            <button class="room-btn" data-room="work"># Иш</button>
            <div id="privateRooms"></div>
        </div>

        <div id="messages"></div>
        <div id="typingIndicator"></div>

        <div id="replyingTo">
            <span id="replyText"></span>
            <span id="cancelReply">✖</span>
        </div>

        <div id="stickerPanel">
            <span class="sticker">😂</span><span class="sticker">🔥</span><span class="sticker">💯</span>
            <span class="sticker">❤️</span><span class="sticker">👍</span><span class="sticker">🎉</span>
            <span class="sticker">😎</span><span class="sticker">🤔</span><span class="sticker">😢</span>
            <span class="sticker">🥳</span><span class="sticker">👏</span><span class="sticker">🙏</span>
            <span class="sticker">💪</span><span class="sticker">⚡</span><span class="sticker">✨</span>
        </div>

        <div id="inputArea">
            <input type="file" id="fileInput" accept="image/*">
            <button class="icon-btn" id="stickerBtn" title="Стикер">😊</button>
            <button class="icon-btn" id="imgBtn" title="Расм">📷</button>
            <button class="icon-btn" id="micBtn" title="Овоз">🎤</button>
            <input type="text" id="msgInput" placeholder="Хабар ёзинг..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, onChildChanged, serverTimestamp, onDisconnect, set, onValue, remove, update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDbsDFe8L_v-H_dKCv5m3rYWUOnymKJi14",
            authDomain: "doira-chat-2026.firebaseapp.com",
            databaseURL: "https://doira-chat-2026-default-rtdb.firebaseio.com",
            projectId: "doira-chat-2026",
            storageBucket: "doira-chat-2026.firebasestorage.app",
            messagingSenderId: "24569627793",
            appId: "1:24569627793:web:b1a8acb36d17adc180ab30"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUser = '';
        let currentRoom = 'general';
        let replyingTo = null;
        let typingTimeout;
        let mediaRecorder;
        let audioChunks = [];
        let messageElements = {};
        let allMessages = {};
        let encryptionKey = null;

        // ШИФРЛАШ ФУНКЦИЯЛАРИ
        async function generateKey(roomName) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(roomName + 'DOIRA_SECRET_2026'),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: encoder.encode('DOIRA_SALT'),
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptText(text, key) {
            const encoder = new TextEncoder();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encoder.encode(text)
            );
            const combined = new Uint8Array(iv.length + encrypted.byteLength);
            combined.set(iv);
            combined.set(new Uint8Array(encrypted), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptText(encryptedData, key) {
            try {
                const combined = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
                const iv = combined.slice(0, 12);
                const data = combined.slice(12);
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    data
                );
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return '[Шифрланган хабар]';
            }
        }

        // ТЕМНЫЙ РЕЖИМ
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        document.getElementById('themeBtn').onclick = () => {
            document.body.classList.toggle('dark');
