<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOIRA Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #login, #chat {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chat { 
            display: none; 
            flex-direction: column; 
            height: 85vh;
            max-width: 600px;
        }
        h1 { 
            color: #667eea;
            text-align: center; 
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 600;
        }
        .subtitle { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #64748b;
            font-size: 14px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #logoutBtn {
            width: auto;
            padding: 8px 16px;
            background: #ef4444;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 15px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 15px;
            background: #f8fafc;
            border-radius: 16px;
        }
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .message {
            padding: 12px 16px;
            margin-bottom: 12px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            animation: msgIn 0.3s ease;
            word-wrap: break-word;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-header {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            margin-right: 10px;
        }
        .user-name { color: #667eea; font-weight: 600; font-size: 14px; }
        .time { color: #94a3b8; font-size: 11px; margin-left: auto; }
        .msg-text {
            color: #334155;
            font-size: 15px;
            line-height: 1.5;
            margin-left: 42px;
        }
        #inputArea { display: flex; gap: 10px; }
        #msgInput { flex: 1; margin: 0; }
        #sendBtn { width: 110px; margin: 0; padding: 14px; }
    </style>
</head>
<body>
    <div id="login">
        <h1>DOIRA</h1>
        <p class="subtitle">Жамоавий чатга хуш келибсиз 🚀</p>
        <input type="text" id="nameInput" placeholder="Исмингизни ёзинг" autocomplete="off">
        <button id="joinBtn">Чатга кириш</button>
    </div>

    <div id="chat">
        <div class="header-bar">
            <h1>DOIRA Чат</h1>
            <button id="logoutBtn">Чиқиш</button>
        </div>
        <p class="subtitle">Онлайн мулоқот</p>
        <div id="messages"></div>
        <div id="inputArea">
            <input type="text" id="msgInput" placeholder="Хабар ёзинг..." autocomplete="off">
            <button id="sendBtn">Юбориш ➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

        // ⚠️ FIREBASE CONFIG - ЎЗИНГНИКИНИ ҚЎЙ!
        const firebaseConfig = {
            apiKey: "SENING-API-KEY",
            authDomain: "SENING-PROJECT.firebaseapp.com",
            databaseURL: "https://SENING-PROJECT-default-rtdb.firebaseio.com",
            projectId: "SENING-PROJECT",
            storageBucket: "SENING-PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUser = '';

        // АГАР ОЛДИН КИРГАН БЎЛСА - АВТОМАТ КИРДИ
        window.onload = () => {
            const savedName = localStorage.getItem('doiraUser');
            if (savedName) {
                currentUser = savedName;
                document.getElementById('login').style.display = 'none';
                document.getElementById('chat').style.display = 'flex';
                loadMessages();
            }
        };

        document.getElementById('joinBtn').onclick = () => {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Илтимос, исмингизни киритинг!');
                return;
            }
            currentUser = name;
            localStorage.setItem('doiraUser', name); // ЭСЛАБ ҚОЛДИ
            document.getElementById('login').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
            loadMessages();
        };

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.removeItem('doiraUser');
            location.reload();
        };

        function loadMessages() {
            const messagesRef = ref(db, 'messages');
            document.getElementById('messages').innerHTML = '';
            
            onChildAdded(messagesRef, (snapshot) => {
                const msg = snapshot.val();
                if (!msg || (!msg.name && !msg.user)) return;
                
                let timeStr = '';
                if (msg.time) {
                    const date = new Date(msg.time);
                    timeStr = date.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
                }
                
                const userName = msg.name || msg.user || 'Номаълум';
                const firstLetter = userName.charAt(0).toUpperCase();
                
                const div = document.createElement('div');
                div.className = 'message';
                div.innerHTML = `
                    <div class="msg-header">
                        <div class="avatar">${firstLetter}</div>
                        <span class="user-name">${userName}</span>
                        <span class="time">${timeStr}</span>
                    </div>
                    <div class="msg-text">${msg.text}</div>
                `;
                
                document.getElementById('messages').appendChild(div);
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            });
        }

        function sendMessage() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text || !currentUser) return;
            
            push(ref(db, 'messages'), {
                name: currentUser,
                text: text,
                time: serverTimestamp()
            });
            
            document.getElementById('msgInput').value = '';
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
    </script>
</body>
</html>
