<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOIRA Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --msg-bg: white;
            --text-color: #334155;
            --input-bg: #f8fafc;
            --border: #e2e8f0;
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --msg-bg: #334155;
            --text-color: #e2e8f0;
            --input-bg: #1e293b;
            --border: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s;
        }
        #login, #chat {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #chat {
            display: none;
            flex-direction: column;
            height: 90vh;
            max-width: 700px;
            padding: 20px;
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 600;
        }
      .subtitle {
            text-align: center;
            margin-bottom: 15px;
            color: #64748b;
            font-size: 14px;
        }
      .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
      .header-controls {
            display: flex;
            gap: 8px;
        }
        #themeBtn, #logoutBtn, #searchBtn, #roomsBtn {
            width: auto;
            padding: 8px 12px;
            font-size: 13px;
        }
        #themeBtn { background: #475569; }
        #logoutBtn { background: #ef4444; }
        #searchBtn { background: #10b981; }
        #roomsBtn { background: #3b82f6; }

        #onlineList {
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #10b981;
            max-height: 50px;
            overflow-y: auto;
        }

        #searchBox {
            display: none;
            margin-bottom: 10px;
        }
        #searchInput {
            margin: 0;
        }

        #roomsPanel {
            display: none;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }
       .room-btn {
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
            margin: 4px;
            background: #64748b;
        }
       .room-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            color: var(--text-color);
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 8px;
            background: var(--input-bg);
            border-radius: 16px;
        }
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        #typingIndicator {
            height: 18px;
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
            padding: 0 5px;
        }

      .message {
            padding: 10px 14px;
            margin-bottom: 10px;
            background: var(--msg-bg);
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0.06);
            animation: msgIn 0.3s ease;
            word-wrap: break-word;
            position: relative;
        }
       .message.highlight {
            background: #fef3c7;
            border: 2px solid #f59e0b;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
      .msg-header {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
      .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 13px;
            margin-right: 8px;
        }
      .user-name { color: #667eea; font-weight: 600; font-size: 13px; cursor: pointer; }
      .user-name:hover { text-decoration: underline; }
      .time { color: #94a3b8; font-size: 10px; margin-left: auto; }
      .msg-actions {
            display: flex;
            gap: 6px;
            margin-left: 8px;
        }
      .msg-btn {
            width: auto;
            padding: 3px 7px;
            font-size: 11px;
            background: #64748b;
        }
      .reply-preview {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            padding: 6px 10px;
            margin-bottom: 6px;
            margin-left: 38px;
            border-radius: 8px;
            font-size: 12px;
            color: #64748b;
        }
      .msg-text {
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.5;
            margin-left: 38px;
        }
      .msg-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-left: 38px;
            margin-top: 6px;
            cursor: pointer;
        }
      .msg-audio {
            margin-left: 38px;
            margin-top: 6px;
            width: calc(100% - 38px);
        }
      .reactions {
            display: flex;
            gap: 6px;
            margin-left: 38px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
      .reaction-btn {
            width: auto;
            padding: 4px 8px;
            font-size: 13px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
        }
      .reaction-btn.active {
            background: #667eea;
            color: white;
        }

        #inputArea {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        #msgInput { flex: 1; margin: 0; }
      .icon-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 18px;
        }
        #sendBtn { width: 80px; margin: 0; padding: 12px; }
        #fileInput { display: none; }

        #stickerPanel {
            display: none;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            max-height: 150px;
            overflow-y: auto;
        }
      .sticker {
            font-size: 32px;
            cursor: pointer;
            padding: 5px;
            display: inline-block;
            transition: transform 0.2s;
        }
      .sticker:hover { transform: scale(1.2); }

        #replyingTo {
            display: none;
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 12px;
            color: #64748b;
        }
        #cancelReply {
            float: right;
            cursor: pointer;
            color: #ef4444;
        }

      .recording {
            background: #ef4444!important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div id="login">
        <h1>DOIRA</h1>
        <p class="subtitle">Жамоавий чатга хуш келибсиз 🚀</p>
        <input type="text" id="nameInput" placeholder="Исмингизни ёзинг" autocomplete="off">
        <button id="joinBtn">Чатга кириш</button>
    </div>

    <div id="chat">
        <div class="header-bar">
            <h1>DOIRA Чат</h1>
            <div class="header-controls">
                <button id="roomsBtn">💬</button>
                <button id="searchBtn">🔍</button>
                <button id="themeBtn">🌙</button>
                <button id="logoutBtn">Чиқиш</button>
            </div>
        <div id="onlineList">🟢 Онлайн: </div>

        <div id="searchBox">
            <input type="text" id="searchInput" placeholder="Хабарлардан қидириш...">
        </div>

        <div id="roomsPanel">
            <button class="room-btn active" data-room="general"># Умумий</button>
            <button class="room-btn" data-room="random"># Суҳбат</button>
            <button class="room-btn" data-room="work"># Иш</button>
            <div id="privateRooms"></div>
        </div>

        <div id="messages"></div>
        <div id="typingIndicator"></div>

        <div id="replyingTo">
            <span id="replyText"></span>
            <span id="cancelReply">✖</span>
        </div>

        <div id="stickerPanel">
            <span class="sticker">😂</span><span class="sticker">🔥</span><span class="sticker">💯</span>
            <span class="sticker">❤️</span><span class="sticker">👍</span><span class="sticker">🎉</span>
            <span class="sticker">😎</span><span class="sticker">🤔</span><span class="sticker">😢</span>
            <span class="sticker">🥳</span><span class="sticker">👏</span><span class="sticker">🙏</span>
            <span class="sticker">💪</span><span class="sticker">⚡</span><span class="sticker">✨</span>
        </div>

        <div id="inputArea">
            <input type="file" id="fileInput" accept="image/*">
            <button class="icon-btn" id="stickerBtn" title="Стикер">😊</button>
            <button class="icon-btn" id="imgBtn" title="Расм">📷</button>
            <button class="icon-btn" id="micBtn" title="Овоз">🎤</button>
            <input type="text" id="msgInput" placeholder="Хабар ёзинг..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, onChildChanged, serverTimestamp, onDisconnect, set, onValue, remove, update } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDbsDFe8L_v-H_dKCv5m3rYWUOnymKJi14",
            authDomain: "doira-chat-2026.firebaseapp.com",
            databaseURL: "https://doira-chat-2026-default-rtdb.firebaseio.com",
            projectId: "doira-chat-2026",
            storageBucket: "doira-chat-2026.firebasestorage.app",
            messagingSenderId: "24569627793",
            appId: "1:24569627793:web:b1a8acb36d17adc180ab30"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUser = '';
        let currentRoom = 'general';
        let replyingTo = null;
        let typingTimeout;
        let mediaRecorder;
        let audioChunks = [];
        let messageElements = {};
        let allMessages = {};

        // ТЕМНЫЙ РЕЖИМ
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        document.getElementById('themeBtn').onclick = () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('themeBtn').textContent = isDark? '☀️' : '🌙';
        };

        // ХОНАЛАР
        document.getElementById('roomsBtn').onclick = () => {
            const panel = document.getElementById('roomsPanel');
            panel.style.display = panel.style.display === 'none'? 'block' : 'none';
        };

        document.querySelectorAll('.room-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRoom = btn.dataset.room;
                loadMessages();
                document.getElementById('roomsPanel').style.display = 'none';
            };
        });

        // ҚИДИРУВ
        document.getElementById('searchBtn').onclick = () => {
            const box = document.getElementById('searchBox');
            box.style.display = box.style.display === 'none'? 'block' : 'none';
            if (box.style.display === 'block') document.getElementById('searchInput').focus();
        };

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.message').forEach(msg => {
                const text = msg.textContent.toLowerCase();
                if (query && text.includes(query)) {
                    msg.classList.add('highlight');
                    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    msg.classList.remove('highlight');
                }
            });
        };

        window.onload = () => {
            const savedName = localStorage.getItem('doiraUser');
            if (savedName) {
                currentUser = savedName;
                showChat();
            }
        };

        function showChat() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
            setupOnlineStatus();
            loadMessages();
            setupTypingIndicator();
        }

        document.getElementById('joinBtn').onclick = () => {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Илтимос, исмингизни киритинг!');
                return;
            }
            currentUser = name;
            localStorage.setItem('doiraUser', name);
            showChat();
        };

        document.getElementById('logoutBtn').onclick = () => {
            set(ref(db, `status/${currentUser}`), null);
            localStorage.removeItem('doiraUser');
            location.reload();
        };

        // ОНЛАЙН РЎЙХАТ
        function setupOnlineStatus() {
            const userStatusRef = ref(db, `status/${currentUser}`);
            const connectedRef = ref(db, '.info/connected');

            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    set(userStatusRef, { online: true, name: currentUser });
                    onDisconnect(userStatusRef).remove();
                }
            });

            onValue(ref(db, 'status'), (snapshot) => {
                const users = [];
                snapshot.forEach(child => {
                    if (child.val().online) users.push(child.val().name);
                });
                document.getElementById('onlineList').textContent = `🟢 Онлайн: ${users.join(', ')}`;
            });
        }

        // ХАБАРЛАРНИ ЮКЛАШ
        function loadMessages() {
            const messagesRef = ref(db, `rooms/${currentRoom}/messages`);
            document.getElementById('messages').innerHTML = '';
            messageElements = {};
            allMessages = {};

            onChildAdded(messagesRef, (snapshot) => {
                const msg = snapshot.val();
                const msgId = snapshot.key;
                if (!msg) return;
                allMessages[msgId] = msg;
                renderMessage(msgId, msg);
            });

            onChildRemoved(messagesRef, (snapshot) => {
                const msgId = snapshot.key;
                if (messageElements[msgId]) {
                    messageElements[msgId].remove();
                    delete messageElements[msgId];
                    delete allMessages[msgId];
                }
            });

            onChildChanged(messagesRef, (snapshot) => {
                const msg = snapshot.val();
                const msgId = snapshot.key;
                allMessages[msgId] = msg;
                if (messageElements[msgId]) {
                    messageElements[msgId].remove();
                    renderMessage(msgId, msg);
                }
            });
        }

        function renderMessage(msgId, msg) {
            let timeStr = '';
            if (msg.time) {
                const date = new Date(msg.time);
                timeStr = date.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
            }

            const userName = msg.name || 'Номаълум';
            const firstLetter = userName.charAt(0).toUpperCase();
            const isOwn = userName === currentUser;

            const div = document.createElement('div');
            div.className = 'message';
            div.id = msgId;

            let replyHtml = '';
            if (msg.replyTo && allMessages[msg.replyTo]) {
                const replyMsg = allMessages[msg.replyTo];
                replyHtml = `<div class="reply-preview">↩️ ${replyMsg.name}: ${replyMsg.text?.substring(0, 30) || 'Расм'}...</div>`;
            }

            let content = '';
            if (msg.type === 'image') {
                content = `<img src="${msg.text}" class="msg-image" onclick="window.open('${msg.text}')">`;
            } else if (msg.type === 'audio') {
                content = `<audio controls class="msg-audio"><source src="${msg.text}"></audio>`;
            } else if (msg.type === 'sticker') {
                content = `<div class="msg-text" style="font-size: 48px; margin-left: 38px;">${msg.text}</div>`;
            } else {
                content = `<div class="msg-text">${msg.text}</div>`;
            }

            const reactions = msg.reactions || {};
            const reactionHtml = Object.keys(reactions).length > 0? `
                <div class="reactions">
                    ${Object.entries(reactions).map(([emoji, users]) =>
                        `<button class="reaction-btn ${users.includes(currentUser)? 'active' : ''}" onclick="toggleReaction('${msgId}', '${emoji}')">${emoji} ${users.length}</button>`
                    ).join('')}
                </div>
            ` : '';

            div.innerHTML = `
                ${replyHtml}
                <div class="msg-header">
                    <div class="avatar">${firstLetter}</div>
                    <span class="user-name" onclick="startPrivateChat('${userName}')">${userName}</span>
                    <span class="time">${timeStr}</span>
                    <div class="msg-actions">
                        <button class="msg-btn" onclick="replyToMessage('${msgId}')">↩️</button>
                        <button class="msg-btn" onclick="addReaction('${msgId}')">❤️</button>
                        ${isOwn? `<button class="msg-btn" onclick="deleteMessage('${msgId}')">🗑️</button>` : ''}
                    </div>
                </div>
                ${content}
                ${reactionHtml}
            `;

            document.getElementById('messages').appendChild(div);
            messageElements[msgId] = div;
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        // REPLY
        window.replyToMessage = (msgId) => {
            const msg = allMessages[msgId];
            replyingTo = msgId;
            document.getElementById('replyingTo').style.display = 'block';
            document.getElementById('replyText').textContent = `↩️ ${msg.name}: ${msg.text?.substring(0, 30) || 'Расм'}...`;
            document.getElementById('msgInput').focus();
        };

        document.getElementById('cancelReply').onclick = () => {
            replyingTo = null;
            document.getElementById('replyingTo').style.display = 'none';
        };

        // REACTIONS
        window.addReaction = (msgId) => {
            const emoji = prompt('Реакция танланг: ❤️ 👍 😂 🔥 💯', '❤️');
            if (emoji) toggleReaction(msgId, emoji);
        };

        window.toggleReaction = (msgId, emoji) => {
            const msg = allMessages[msgId];
            const reactions = msg.reactions || {};
            const users = reactions[emoji] || [];
            const idx = users.indexOf(currentUser);

            if (idx > -1) users.splice(idx, 1);
            else users.push(currentUser);

            if (users.length === 0) delete reactions[emoji];
            else reactions[emoji] = users;

            update(ref(db, `rooms/${currentRoom}/messages/${msgId}`), { reactions });
        };

        // 1-1 ЧАТ
        window.startPrivateChat = (otherUser) => {
            if (otherUser === currentUser) return;
            const users = [currentUser, otherUser].sort();
            currentRoom = `dm_${users[0]}_${users[1]}`;

            const btn = document.createElement('button');
            btn.className = 'room-btn active';
            btn.textContent = `💬 ${otherUser}`;
            btn.onclick = () => {
                document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadMessages();
            };
            document.getElementById('privateRooms').appendChild(btn);
            loadMessages();
        };

        // ХАБАРНИ ЎЧИРИШ
        window.deleteMessage = (msgId) => {
            if (confirm('Хабарни ўчиришни хоҳлайсизми?')) {
                remove(ref(db, `rooms/${currentRoom}/messages/${msgId}`));
            }
        };

        // ХАБАР ЮБОРИШ
        function sendMessage() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text ||!currentUser) return;

            const msgData = {
                name: currentUser,
                text: text,
                time: serverTimestamp(),
                type: 'text'
            };
            if (replyingTo) msgData.replyTo = replyingTo;

            push(ref(db, `rooms/${currentRoom}/messages`), msgData);

            document.getElementById('msgInput').value = '';
            replyingTo = null;
            document.getElementById('replyingTo').style.display = 'none';
            set(ref(db, `typing/${currentRoom}/${currentUser}`), null);
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        // "ЁЗЯПТИ..." ИНДИКАТОРИ
        document.getElementById('msgInput').oninput = () => {
            set(ref(db, `typing/${currentRoom}/${currentUser}`), true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                set(ref(db, `typing/${currentRoom}/${currentUser}`), null);
            }, 2000);
        };

        function setupTypingIndicator() {
            onValue(ref(db, `typing/${currentRoom}`), (snapshot) => {
                const typing = [];
                snapshot.forEach(child => {
                    if (child.key!== currentUser && child.val()) {
                        typing.push(child.key);
                    }
                });
                document.getElementById('typingIndicator').textContent =
                    typing.length? `${typing.join(', ')} ёзяпти...` : '';
            });
        }

        // СТИКЕРЛАР
        document.getElementById('stickerBtn').onclick = () => {
            const panel = document.getElementById('stickerPanel');
            panel.style.display = panel.style.display === 'none'? 'block' : 'none';
        };

        document.querySelectorAll('.sticker').forEach(sticker => {
            sticker.onclick = () => {
                push(ref(db, `rooms/${currentRoom}/messages`), {
                    name: currentUser,
                    text: sticker.textContent,
                    time: serverTimestamp(),
                    type: 'sticker'
                });
                document.getElementById('stickerPanel').style.display = 'none';
            };
        });

        // РАСМ ЮБОРИШ
        document.getElementById('imgBtn').onclick = () => {
            document.getElementById('fileInput').click();
        };

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                push(ref(db, `rooms/${currentRoom}/messages`), {
                    name: currentUser,
                    text: event.target.result,
                    time: serverTimestamp(),
                    type: 'image'
                });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        };

        // ОВОЗЛИ ХАБАР
        document.getElementById('micBtn').onclick = async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                document.getElementById('micBtn').classList.remove('recording');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        push(ref(db, `rooms/${currentRoom}/messages`), {
                            name: currentUser,
                            text: event.target.result,
                            time: serverTimestamp(),
                            type: 'audio'
                        });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                document.getElementById('micBtn').classList.add('recording');
            } catch (err) {
                alert('Микрофонга рухсат беринг!');
            }
        };
    </script>
</body>
</html>
