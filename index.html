<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOIRA Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --msg-bg: white;
            --text-color: #334155;
            --input-bg: #f8fafc;
            --border: #e2e8f0;
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --msg-bg: #334155;
            --text-color: #e2e8f0;
            --input-bg: #1e293b;
            --border: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 8px;
            overflow: hidden;
        }
        #login, #chat {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        #chat {
            display: none;
            flex-direction: column;
            height: 98vh;
            height: 98dvh;
            max-width: 700px;
            padding: 12px;
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 5px;
            font-size: 22px;
            font-weight: 600;
        }
        .subtitle {
            text-align: center;
            margin-bottom: 10px;
            color: #64748b;
            font-size: 12px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 6px;
            flex-shrink: 0;
        }
        .header-controls {
            display: flex;
            gap: 5px;
        }
        #themeBtn, #logoutBtn, #roomsBtn {
            width: auto;
            padding: 6px 9px;
            font-size: 11px;
        }
        #themeBtn { background: #475569; }
        #logoutBtn { background: #ef4444; }
        #roomsBtn { background: #3b82f6; }

        #onlineList {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 5px 8px;
            margin-bottom: 6px;
            font-size: 10px;
            color: #10b981;
            max-height: 40px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #roomsPanel {
            display: none;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .room-btn {
            width: auto;
            padding: 5px 8px;
            font-size: 11px;
            margin: 2px;
            background: #64748b;
        }
        .room-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .room-btn.locked::after {
            content: ' 🔒';
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            color: var(--text-color);
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 5px;
            background: var(--input-bg);
            border-radius: 14px;
            -webkit-overflow-scrolling: touch;
        }
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        .message {
            padding: 8px 10px;
            margin-bottom: 6px;
            background: var(--msg-bg);
            border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0.04);
            word-wrap: break-word;
            position: relative;
        }
        .msg-header {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 11px;
            margin-right: 6px;
        }
        .user-name { color: #667eea; font-weight: 600; font-size: 11px; cursor: pointer; }
        .time { color: #94a3b8; font-size: 9px; margin-left: auto; }
        .msg-actions {
            display: flex;
            gap: 4px;
            margin-left: 5px;
        }
        .msg-btn {
            width: auto;
            padding: 2px 5px;
            font-size: 9px;
            background: #64748b;
        }
        .msg-text {
            color: var(--text-color);
            font-size: 13px;
            line-height: 1.4;
            margin-left: 32px;
        }
        .msg-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-left: 32px;
            margin-top: 4px;
            cursor: pointer;
        }

        #inputArea {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
            padding-top: 4px;
        }
        #msgInput { flex: 1; margin: 0; font-size: 16px; }
        .icon-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            font-size: 16px;
        }
        #sendBtn { width: 65px; margin: 0; padding: 10px; }
        #fileInput { display: none; }

        #encryptedBadge {
            display: none;
            background: #10b981;
            color: white;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 9px;
            margin-bottom: 5px;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="login">
        <h1>DOIRA</h1>
        <p class="subtitle">Жамоавий чатга хуш келибсиз 🚀</p>
        <input type="text" id="nameInput" placeholder="Исмингизни ёзинг" autocomplete="off">
        <button id="joinBtn">Чатга кириш</button>
    </div>

    <div id="chat">
        <div class="header-bar">
            <h1>DOIRA Чат</h1>
            <div class="header-controls">
                <button id="roomsBtn">💬</button>
                <button id="themeBtn">🌙</button>
                <button id="logoutBtn">Чиқиш</button>
            </div>
        </div>
        <div id="encryptedBadge">🔒 Махфий чат</div>
        <div id="onlineList">🟢 Онлайн: </div>

        <div id="roomsPanel">
            <button class="room-btn active" data-room="general"># Умумий</button>
            <div id="privateRooms"></div>
        </div>

        <div id="messages"></div>

        <div id="inputArea">
            <input type="file" id="fileInput" accept="image/*">
            <button class="icon-btn" id="imgBtn" title="Расм">📷</button>
            <input type="text" id="msgInput" placeholder="Хабар ёзинг..." autocomplete="off">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, serverTimestamp, onDisconnect, set, onValue, remove, query, limitToLast } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDbsDFe8L_v-H_dKCv5m3rYWUOnymKJi14",
            authDomain: "doira-chat-2026.firebaseapp.com",
            databaseURL: "https://doira-chat-2026-default-rtdb.firebaseio.com",
            projectId: "doira-chat-2026",
            storageBucket: "doira-chat-2026.firebasestorage.app",
            messagingSenderId: "24569627793",
            appId: "1:24569627793:web:b1a8acb36d17adc180ab30"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUser = '';
        let currentRoom = 'general';
        let encryptionKey = null;

        // ШИФРЛАШ
        async function generateKey(roomName) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(roomName + 'DOIRA_SECRET_2026'),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: encoder.encode('DOIRA_SALT'),
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptText(text, key) {
            const encoder = new TextEncoder();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encoder.encode(text)
            );
            const combined = new Uint8Array(iv.length + encrypted.byteLength);
            combined.set(iv);
            combined.set(new Uint8Array(encrypted), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptText(encryptedData, key) {
            try {
                const combined = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
                const iv = combined.slice(0, 12);
                const data = combined.slice(12);
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    data
                );
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return '[Шифрланган]';
            }
        }

        // ТЕМНЫЙ РЕЖИМ
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        document.getElementById('themeBtn').onclick = () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('themeBtn').textContent = isDark? '☀️' : '🌙';
        };

        // ХОНАЛАР
        document.getElementById('roomsBtn').onclick = () => {
            const panel = document.getElementById('roomsPanel');
            panel.style.display = panel.style.display === 'none'? 'block' : 'none';
        };

        document.querySelectorAll('.room-btn').forEach(btn => {
            btn.onclick = async () => {
                document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRoom = btn.dataset.room;
                encryptionKey = currentRoom.startsWith('dm_')? await generateKey(currentRoom) : null;
                document.getElementById('encryptedBadge').style.display = encryptionKey? 'block' : 'none';
                loadMessages();
                document.getElementById('roomsPanel').style.display = 'none';
            };
        });

        window.onload = () => {
            const savedName = localStorage.getItem('doiraUser');
            if (savedName) {
                currentUser = savedName;
                showChat();
            }
        };

        function showChat() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
            setupOnlineStatus();
            loadMessages();
        }

        document.getElementById('joinBtn').onclick = () => {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Илтимос, исмингизни киритинг!');
                return;
            }
            currentUser = name;
            localStorage.setItem('doiraUser', name);
            showChat();
        };

        document.getElementById('logoutBtn').onclick = () => {
            set(ref(db, `status/${currentUser}`), null);
            localStorage.removeItem('doiraUser');
            location.reload();
        };

        // ОНЛАЙН
        function setupOnlineStatus() {
            const userStatusRef = ref(db, `status/${currentUser}`);
            const connectedRef = ref(db, '.info/connected');

            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    set(userStatusRef, { online: true, name: currentUser });
                    onDisconnect(userStatusRef).remove();
                }
            });

            onValue(ref(db, 'status'), (snapshot) => {
                const users = [];
                snapshot.forEach(child => {
                    if (child.val().online) users.push(child.val().name);
                });
                document.getElementById('onlineList').textContent = `🟢 Онлайн: ${users.join(', ')}`;
            });
        }

        // ХАБАРЛАРНИ ЮКЛАШ - ФАҚАТ 50 ТА
        async function loadMessages() {
            const messagesRef = query(ref(db, `rooms/${currentRoom}/messages`), limitToLast(50));
            document.getElementById('messages').innerHTML = '';

            onChildAdded(messagesRef, async (snapshot) => {
                const msg = snapshot.val();
                const msgId = snapshot.key;
                if (!msg) return;

                if (msg.encrypted && encryptionKey) {
                    msg.text = await decryptText(msg.text, encryptionKey);
                }

                renderMessage(msgId, msg);
            });

            onChildRemoved(ref(db, `rooms/${currentRoom}/messages`), (snapshot) => {
                const msgId = snapshot.key;
                const el = document.getElementById(msgId);
                if (el) el.remove();
            });
        }

        function renderMessage(msgId, msg) {
            let timeStr = '';
            if (msg.time) {
                const date = new Date(msg.time);
                timeStr = date.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
            }

            const userName = msg.name || 'Номаълум';
            const firstLetter = userName.charAt(0).toUpperCase();
            const isOwn = userName === currentUser;

            const div = document.createElement('div');
            div.className = 'message';
            div.id = msgId;

            let content = '';
            if (msg.type === 'image') {
                content = `<img src="${msg.text}" class="msg-image" onclick="window.open('${msg.text}')">`;
            } else {
                content = `<div class="msg-text">${msg.text}</div>`;
            }

            div.innerHTML = `
                <div class="msg-header">
                    <div class="avatar">${firstLetter}</div>
                    <span class="user-name" onclick="startPrivateChat('${userName}')">${userName}</span>
                    <span class="time">${timeStr}</span>
                    <div class="msg-actions">
                        ${isOwn? `<button class="msg-btn" onclick="deleteMessage('${msgId}')">🗑️</button>` : ''}
                    </div>
                ${content}
            `;

            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        // 1-1 МАХФИЙ ЧАТ
        window.startPrivateChat = async (otherUser) => {
            if (otherUser === currentUser) return;
            const users = [currentUser, otherUser].sort();
            currentRoom = `dm_${users[0]}_${users[1]}`;
            encryptionKey = await generateKey(currentRoom);

            const existingBtn = document.querySelector(`.room-btn[data-room="${currentRoom}"]`);
            if (!existingBtn) {
                const btn = document.createElement('button');
                btn.className = 'room-btn active locked';
                btn.dataset.room = currentRoom;
                btn.textContent = `💬 ${otherUser}`;
                btn.onclick = async () => {
                    document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentRoom = btn.dataset.room;
                    encryptionKey = await generateKey(currentRoom);
                    document.getElementById('encryptedBadge').style.display = 'block';
                    loadMessages();
                };
                document.getElementById('privateRooms').appendChild(btn);
            }

            document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.room-btn[data-room="${currentRoom}"]`).classList.add('active');
            document.getElementById('encryptedBadge').style.display = 'block';
            loadMessages();
        };

        // ЎЧИРИШ
        window.deleteMessage = (msgId) => {
            if (confirm('Ўчирасизми?')) {
                remove(ref(db, `rooms/${currentRoom}/messages/${msgId}`));
            }
        };

        // ЮБОРИШ
        async function sendMessage() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text ||!currentUser) return;

            let msgData = {
                name: currentUser,
                time: serverTimestamp(),
                type: 'text'
            };

            if (encryptionKey) {
                msgData.text = await encryptText(text, encryptionKey);
                msgData.encrypted = true;
            } else {
                msgData.text = text;
            }

            push(ref(db, `rooms/${currentRoom}/messages`), msgData);
            document.getElementById('msgInput').value = '';
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        // РАСМ
        document.getElementById('imgBtn').onclick = () => {
            document.getElementById('fileInput').click();
        };

        document.getElementById('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                let msgData = {
                    name: currentUser,
                    time: serverTimestamp(),
                    type: 'image'
                };

                if (encryptionKey) {
                    msgData.text = await encryptText(event.target.result, encryptionKey);
                    msgData.encrypted = true;
                } else {
                    msgData.text = event.target.result;
                }

                push(ref(db, `rooms/${currentRoom}/messages`), msgData);
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        };
    </script>
</body>
</html>
