<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doira Chat V4.0 - Real Time</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);height:100vh;display:flex;justify-content:center;align-items:center}.chat-container{width:95%;max-width:500px;height:90vh;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:20px;text-align:center}.header h1{font-size:24px;margin-bottom:5px}.online{font-size:14px;opacity:.9}.messages{flex:1;padding:20px;overflow-y:auto;background:#f5f5}.msg{margin-bottom:15px;display:flex;gap:10px;animation:slideIn .3s ease}@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.msg-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.msg-content{flex:1}.msg-name{font-weight:700;font-size:14px;color:#667eea;margin-bottom:3px}.msg-text{background:#fff;padding:10px 15px;border-radius:15px;box-shadow:0 2px 5px rgba(0,0,0,.1);word-wrap:break-word}.msg-time{font-size:11px;color:#999;margin-top:3px}.msg.own{flex-direction:row-reverse}.msg.own .msg-text{background:#667eea;color:#fff}.msg.own .msg-name{text-align:right;color:#764ba2}.msg.own .msg-time{text-align:right}.typing{padding:10px 20px;font-size:13px;color:#666;font-style:italic;min-height:20px}.input-area{padding:15px;background:#fff;border-top:1px solid #eee;display:flex;gap:10px}.input-area input{flex:1;padding:12px 15px;border:2px solid #eee;border-radius:25px;font-size:15px;outline:0}.input-area input:focus{border-color:#667eea}.input-area button{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-size:20px;cursor:pointer;transition:transform .2s}.input-area button:hover{transform:scale(1.1)}.login{padding:40px;text-align:center}.login h2{margin-bottom:20px;color:#667eea}.login input{width:100%;padding:15px;margin-bottom:15px;border:2px solid #eee;border-radius:10px;font-size:16px}.emoji-picker{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}.emoji{width:50px;height:50px;border-radius:50%;border:3px solid transparent;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;transition:all .2s}.emoji:hover{transform:scale(1.1)}.emoji.selected{border-color:#667eea;transform:scale(1.15)}.login button{width:100%;padding:15px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer}
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="loginScreen" class="login">
            <h2>🚀 Doira Chat V4.0</h2>
            <input type="text" id="nameInput" placeholder="Исмингиз" maxlength="20">
            <div class="emoji-picker">
                <div class="emoji selected" data-emoji="😎">😎</div>
                <div class="emoji" data-emoji="🔥">🔥</div>
                <div class="emoji" data-emoji="💪">💪</div>
                <div class="emoji" data-emoji="🚀">🚀</div>
                <div class="emoji" data-emoji="⚡">⚡</div>
                <div class="emoji" data-emoji="🎯">🎯</div>
                <div class="emoji" data-emoji="👑">👑</div>
                <div class="emoji" data-emoji="💎">💎</div>
            </div>
            <button id="joinBtn">Чатга кириш</button>
        </div>
        <div id="chatScreen" style="display:none;flex:1;display:flex;flex-direction:column">
            <div class="header"><h1>💬 Doira Chat</h1><div class="online">🟢 <span id="onlineCount">0</span> онлайн</div></div>
            <div class="messages" id="messages"></div>
            <div class="typing" id="typing"></div>
            <div class="input-area"><input type="text" id="msgInput" placeholder="Хабар ёзинг..." maxlength="500"><button id="sendBtn">➤</button></div>
        </div>
    </div>
    <script type="module">
        import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';import{getDatabase,ref,push,onChildAdded,onValue,set,onDisconnect,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        const firebaseConfig = {
         apiKey: "AIzaSyAzR6XQpxgHhs2xBLO3jcCslQq5zMAuRUQ",
          authDomain: "doira-chat-2026.firebaseapp.com",
          databaseURL: "https://doira-chat-2026-default-rtdb.firebaseio.com",
          projectId: "doira-chat-2026",
          storageBucket: "doira-chat-2026.firebasestorage.app",
          messagingSenderId: "24569627793",
          appId: "1:24569627793:web:b1a8acb36d17adc180ab30"
        };

        const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);let currentUser=null;let selectedEmoji='😎';document.querySelectorAll('.emoji').forEach(e=>{e.onclick=()=>{document.querySelectorAll('.emoji').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');selectedEmoji=e.dataset.emoji}});
        
        document.getElementById('joinBtn').onclick=async()=>{
            const name=document.getElementById('nameInput').value.trim();
            if(!name)return alert('Исм киритинг!');
            try{
                await signInAnonymously(auth);
                currentUser={name,emoji:selectedEmoji,id:auth.currentUser.uid};
                const userRef=ref(db,`users/${currentUser.id}`);
                await set(userRef,{name,emoji:selectedEmoji,online:true,timestamp:serverTimestamp()});
                onDisconnect(userRef).remove();
                document.getElementById('loginScreen').style.display='none';
                document.getElementById('chatScreen').style.display='flex';
                loadMessages();loadOnlineUsers();loadTyping();
                if(Notification.permission==='default')Notification.requestPermission()
            }catch(e){alert('Хатолик: '+e.message)}
        };
        
        document.getElementById('sendBtn').onclick=async()=>{
            const input=document.getElementById('msgInput');
            const text=input.value.trim();
            if(!text)return;
            await push(ref(db,'messages'),{text,name:currentUser.name,emoji:currentUser.emoji,userId:currentUser.id,timestamp:serverTimestamp()});
            input.value='';
            set(ref(db,`typing/${currentUser.id}`),null)
        };
        
        document.getElementById('msgInput').onkeypress=e=>{if(e.key==='Enter')document.getElementById('sendBtn').click()};
        let typingTimeout;document.getElementById('msgInput').oninput=()=>{set(ref(db,`typing/${currentUser.id}`),currentUser.name);clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>{set(ref(db,`typing/${currentUser.id}`),null)},2000)};
        
        function loadMessages(){onChildAdded(ref(db,'messages'),snapshot=>{const msg=snapshot.val();const isOwn=msg.userId===currentUser.id;const time=msg.timestamp?new Date(msg.timestamp).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}):'';const div=document.createElement('div');div.className=`msg ${isOwn?'own':''}`;div.innerHTML=`<div class="msg-avatar">${msg.emoji}</div><div class="msg-content"><div class="msg-name">${msg.name}</div><div class="msg-text">${msg.text}</div><div class="msg-time">${time}</div></div>`;document.getElementById('messages').appendChild(div);document.getElementById('messages').scrollTop=999999;if(!isOwn&&Notification.permission==='granted'){new Notification(`${msg.emoji} ${msg.name}`,{body:msg.text})}})}
        function loadOnlineUsers(){onValue(ref(db,'users'),snapshot=>{const users=snapshot.val()||{};document.getElementById('onlineCount').textContent=Object.keys(users).length})}
        function loadTyping(){onValue(ref(db,'typing'),snapshot=>{const typing=snapshot.val()||{};const names=Object.values(typing).filter(n=>n&&n!==currentUser.name);document.getElementById('typing').textContent=names.length?`${names.join(', ')} ёзяпти...`:''})}
    </script>
</body>
</html>
