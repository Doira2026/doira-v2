<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOIRA Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #0f0f0f; 
            color: #fff; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #login { 
            background: #1a1a1a; 
            padding: 40px; 
            border-radius: 10px; 
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        #login h1 { color: #4CAF50; margin-bottom: 20px; }
        #login input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            background: #2a2a2a; 
            border: 1px solid #444; 
            border-radius: 5px;
            color: white;
            font-size: 16px;
        }
        #login button { 
            width: 100%; 
            padding: 12px; 
            background: #4CAF50; 
            border: none; 
            border-radius: 5px;
            color: white; 
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        #login button:hover { background: #45a049; }
        #chat { 
            display: none; 
            width: 100%;
            max-width: 700px;
            height: 100vh;
            background: #1a1a1a;
            flex-direction: column;
        }
        #header {
            background: #2a2a2a;
            padding: 15px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #header h2 { color: #4CAF50; }
        #online { color: #888; font-size: 14px; }
        #messages { 
            flex: 1;
            overflow-y: auto; 
            padding: 20px;
            background: #0f0f0f;
        }
        .msg { 
            margin: 10px 0; 
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            word-wrap: break-word;
        }
        .msg .user { 
            color: #4CAF50; 
            font-weight: bold;
            margin-right: 8px;
        }
        .msg .time {
            color: #666;
            font-size: 11px;
            margin-left: 10px;
        }
        #input-area {
            display: flex;
            padding: 15px;
            background: #2a2a2a;
            border-top: 1px solid #444;
        }
        #msgInput { 
            flex: 1;
            padding: 12px; 
            background: #1a1a1a; 
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            font-size: 16px;
        }
        #sendBtn { 
            padding: 12px 25px;
            background: #4CAF50; 
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin-left: 10px;
            font-size: 16px;
        }
        #sendBtn:hover { background: #45a049; }
    </style>
</head>
<body>
    <div id="login">
        <h1>DOIRA</h1>
        <p style="color: #888; margin-bottom: 20px;">Жамоавий чатга хуш келибсиз</p>
        <input id="nameInput" type="text" placeholder="Исмингизни киритинг" maxlength="20">
        <button id="joinBtn">Чатга кириш</button>
    </div>
    
    <div id="chat">
        <div id="header">
            <h2>DOIRA Chat</h2>
            <div id="online">Online: 0</div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input id="msgInput" type="text" placeholder="Хабар ёзинг..." maxlength="500">
            <button id="sendBtn">Юбориш</button>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInAnonymously, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, set, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDbsDFe8L_v-H_dKCv5m3rYWUOnymKJi14",
  authDomain: "doira-chat-2026.firebaseapp.com",
  databaseURL: "https://doira-chat-2026-default-rtdb.firebaseio.com",
  projectId: "doira-chat-2026",
  storageBucket: "doira-chat-2026.firebasestorage.app",
  messagingSenderId: "24569627793",
  appId: "1:24569627793:web:b1a8acb36d17adc180ab30"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence);
const db = getDatabase(app);

let currentUser = null;
let currentUid = null;

document.getElementById('joinBtn').onclick = async () => {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) {
    alert('Илтимос, исмингизни киритинг');
    return;
  }
  
  try {
    await signInAnonymously(auth);
    currentUser = name;
    currentUid = auth.currentUser.uid;
    
    const userRef = ref(db, 'users/' + currentUid);
    await set(userRef, { 
      name: name, 
      online: true,
      joinedAt: serverTimestamp()
    });
    onDisconnect(userRef).remove();
    
    document.getElementById('login').style.display = 'none';
    document.getElementById('chat').style.display = 'flex';
    
    loadMessages();
    loadOnlineUsers();
  } catch (error) {
    alert('Хатолик: ' + error.message);
  }
};

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').onkeypress = (e) => {
  if (e.key === 'Enter') sendMessage();
};

function sendMessage() {
  const text = document.getElementById('msgInput').value.trim();
  if (!text || !currentUser) return;
  
  push(ref(db, 'messages'), {
    name: currentUser,
    uid: currentUid,
    text: text,
    time: serverTimestamp()
  });
  
  document.getElementById('msgInput').value = '';
}

function loadMessages() {       
 const messagesRef = ref(db, 'messages');
   document.getElementById('messages').innerHTML = '';
onChildAdded(messagesRef, (snapshot) => {    
    const msg = snapshot.val(); 
    if (!msg.name && !msg.user) return;
      const date = new Date(msg.time);
      timeStr = date.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
    }
    
    div.innerHTML = `<span class="user">${msg.name || msg.user}:</span>${msg.text}<span class="time">...
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  });
}

function loadOnlineUsers() {
  onValue(ref(db, 'users'), (snapshot) => {
    const users = snapshot.val() || {};
    document.getElementById('online').textContent = 'Online: ' + Object.keys(users).length;
  });
}
</script>
</body>
</html>
